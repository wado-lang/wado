# Benchmarks Loam as a consumer runs it, like `package-loam/example`: not a
# workspace member, since nothing publishes it.
[package]
name = "loam-benchmark"
version = "0.0.0"

[build-dependencies]
"lib:loam" = { path = "../package-loam", package = "wado-lang:loam", version = "^0.0.28" }

[dependencies]
"lib:loam" = { path = "../package-loam", package = "wado-lang:loam", version = "^0.0.28" }

[test]
exclude = ["build/**"]
