[workspace]
members = ["wado-compiler", "wado-cli", "wado-from-wit", "wado-bundled"]
resolver = "3" # v3 resolver

[workspace.package]
license = "MIT"

[workspace.dependencies]
anyhow = { version = "1" }
ryu = { version = "1.0" }
tokio = { version = "1", features = ["rt", "macros"] }
wasm-encoder = { version = "0.244" }
wasmparser = { version = "0.244" }
wasmprinter = { version = "0.244" }
wasmtime = { version = "40", features = ["async", "component-model", "component-model-async"] }
wasmtime-wasi = { version = "40", features = ["p3"] }
wat = { version = "1.244" }
