[workspace]
members = ["wado-compiler", "wado-cli", "wado-from-idl", "wado-bundled-libm", "wado-manifest", "wado-dev-tools", "wado-lsp"]
# vendor/ holds reference submodules; vendor/wasmtime is our wasmtime fork that we
# depend on via path. Exclude it so cargo does not treat its crates as members of
# this workspace (it has its own workspace root).
exclude = ["vendor"]
resolver = "3" # v3 resolver

[workspace.package]
version = "0.0.6"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
datatest-mini = { version = "0.4" }
anyhow = { version = "1" }
fluent-uri = { version = "0.4" }
glob = { version = "0.3" }
indexmap = { version = "2", features = ["serde"] }
rustc-hash = { version = "2" }
libm = { version = "0.2" }
# Vendored path dep so it dedupes with the copy wasmtime already pulls (the
# fork's 0.133 generation) instead of floating a parallel crates.io tree.
# Pure entity-map data structures; the NIR skeleton arena is built on it.
cranelift-entity = { path = "vendor/wasmtime/cranelift/entity" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
# Keep the wasm-tools family (wasmparser/wasm-encoder/wasmprinter/wit-parser/
# wat) pinned to the same generation wasmtime depends on, so cargo dedupes
# instead of carrying parallel 0.x trees. `wat` needs the tilde pin so a bare
# "1" cannot float up to a newer generation and drag a parallel wast/wasm-encoder
# tree back in through both wado and wasmtime's wasm-compose. `mise run
# check-deps` enforces this; re-align when bumping wasmtime (see AGENTS.md).
wat = { version = "~1.251" }
wasm-encoder = { version = "0.251" }
wasmparser = { version = "0.251" }
wasmprinter = { version = "0.251" }
walrus = { version = "0.26" }
wit-parser = { version = "0.251" }
wit-component = { version = "0.251" }
wit-encoder = { version = "0.251" }
# wasmtime is vendored at vendor/wasmtime (pinned to upstream main, 46.0.0-dev)
# via path dependencies. We track main rather than a release because the copying
# GC collector — which wado uses by default — is only the default and fully
# functional on main. Not published to crates.io, so path deps are fine.
wasmtime = { path = "vendor/wasmtime/crates/wasmtime", features = ["async", "component-model", "component-model-async"] }
wasmtime-wasi = { path = "vendor/wasmtime/crates/wasi", features = ["p3"] }
wasmtime-wasi-http = { path = "vendor/wasmtime/crates/wasi-http", features = ["p3"] }
wasmtime-wasi-tls = { path = "vendor/wasmtime/crates/wasi-tls", default-features = false, features = ["p3", "rustls"] }
bytes = { version = "1" }
futures = { version = "0.3" }
http = { version = "1" }
http-body-util = { version = "0.1" }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server", "server-auto"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = { version = "1" }
rustls-pemfile = { version = "2" }
http-body = { version = "1" }
assert_cmd = { version = "2" }
heck = { version = "0.5" }
lexopt = { version = "0.3.1" }
predicates = { version = "3" }
regex = { version = "1" }
tempfile = { version = "3" }
jsonschema = { version = "0.46" }
zlib-rs = { version = "0.6" }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crc32fast = { version = "1" }
adler = { version = "1" }
toml = { version = "1", default-features = false, features = ["parse", "display", "serde", "preserve_order"] }
libc = { version = "0.2" }
mimalloc = { version = "0.1" }
iana-time-zone = { version = "0.1" }
sha2 = { version = "0.11", default-features = false }
dprint-plugin-markdown = { version = "0.22" }


[profile.dev]
# `line-tables-only` keeps file:line in backtraces (and `RUST_BACKTRACE`
# stack frames) but drops local-variable DWARF, which is the bulk of
# `target/debug/deps/*.rlib` size. With `split-debuginfo = "unpacked"`
# the remaining debuginfo is emitted as sibling `.dwo`/`.o` files
# instead of being baked into the rlib. Together they shrink
# `target/debug` from ~21 GB to roughly ~8 GB, which avoids the
# disk-full link failures the CI runners have been hitting on rebuild.
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Drop `debug_assert!`s and integer-overflow checks in *all third-party
# dependencies* for dev/test builds. The `"*"` glob applies to every
# dependency but never to our own workspace members, so the wado-* crates
# keep their assertions (a compiler bug is always P0 — we want those
# checks during development). The vendored runtime/codegen stack —
# wasmtime, cranelift, regalloc2, wasmparser, … — runs with these checks
# off in release anyway, and they dominate the dev-build cost of
# `wado test`/`run`: wasmtime's copying GC and the cranelift JIT are
# riddled with bounds/precondition `debug_assert!`s. Measured on
# `wado test --no-cache example/wado_syntax_highlight.wado` this cut the
# guest-execution (test) phase by ~45% with no change to our own code.
[profile.dev.package."*"]
debug-assertions = false
overflow-checks = false

[profile.dev.package.wado-compiler]
opt-level = 1

[profile.dev.package.wado-dev-tools]
opt-level = 1

# Upstream bug, unavoidable from our side: dprint-plugin-markdown
# hands multi-line inline code spans (e.g. a backtick fragment that
# wraps across two source lines) straight to dprint-core's printer,
# which then trips a `debug_assert!` at
# dprint-core/src/formatting/printer.rs — "Found a newline in the
# string." The bundled `dprint` CLI is shipped in release, where
# `debug_assert!`s are stripped, so the bug never surfaces there. We
# mirror that here so `wado-dev-tools format-md` works in dev too.
# Remove these stanzas once the upstream is fixed.
[profile.dev.package.dprint-core]
debug-assertions = false

[profile.dev.package.dprint-plugin-markdown]
debug-assertions = false

# Optimize Cranelift in dev/test builds for faster E2E tests.
# Cranelift compiles Wasm→native for every test; without this it runs in debug mode.
# A package with its own override does not inherit the `"*"` glob above, so the
# debug-assertions/overflow-checks opt-outs are repeated here explicitly.
[profile.dev.package.cranelift-codegen]
opt-level = 2
debug-assertions = false
overflow-checks = false

# `release` is the profile for distributed `wado` binaries. `thin` LTO
# captures most of fat LTO's size/perf benefit at a fraction of the
# build cost. `codegen-units = 1` lets thin LTO see the whole crate
# graph as one unit, and `strip = "symbols"` drops the symbol table
# from the final binary. `panic = "unwind"` (the default) is kept
# intentionally because wasmtime relies on Rust unwinding to surface
# guest traps as catchable errors.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# `profiling` is `release` with debug info kept, for sampling profilers
# (samply, perf, Instruments). It matches the production codegen
# (`lto`/`codegen-units` are inherited) but keeps symbols and full
# DWARF so inlined frames resolve. Build with
# `cargo build --profile profiling --bin wado`. It lives in its own
# `target/profiling/` dir, so it never invalidates the `release` cache
# the way overriding release via `CARGO_PROFILE_RELEASE_*` would.
# See the `profile-compiler` skill.
[profile.profiling]
inherits = "release"
debug = 2
strip = false

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
disallowed_types = "warn"
mod_module_files = "deny"
redundant_clone = "warn"
# Compiler-inherent: passes carry many context parameters
too_many_arguments = "allow"
# Compiler-inherent: intentional numeric casts in const folding, CM adapter, etc.
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
invalid_upcast_comparisons = "allow"
# Compiler-inherent: IR nodes have multiple boolean flags
struct_excessive_bools = "allow"
# Compiler-inherent: CLI option enums share prefixes; Wasm codegen uses short names
enum_variant_names = "allow"
many_single_char_names = "allow"
similar_names = "allow"
# Compiler-inherent: exact float comparison is correct in const folding
float_cmp = "allow"
# Compiler-inherent: index/table structs naturally share suffixes
struct_field_names = "allow"
# Compiler-inherent: Wasm uses 32-bit types, casts are intentional
cast_possible_truncation = "allow"
# Compiler-inherent: large functions are acceptable in compiler code
too_many_lines = "allow"
# Compiler-inherent: complex types are normal in compilers
type_complexity = "allow"
# Not useful for internal compiler code
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Type names like LexerError in lexer module are fine
module_name_repetitions = "allow"
# Items in functions are fine for test helpers
items_after_statements = "allow"
# &Option<T> is fine when coming from struct fields
ref_option = "allow"
# Explicit arms with comments are sometimes clearer
match_same_arms = "allow"
# u8 by ref is fine for consistency in visitor/codegen signatures
trivially_copy_pass_by_ref = "allow"
# Default hasher is fine
implicit_hasher = "allow"
# map(f).unwrap_or(x) is sometimes clearer than map_or
map_unwrap_or = "allow"
# Ownership transfer is sometimes intentional
needless_pass_by_value = "allow"
# Visitor pattern methods may not use self yet
unused_self = "allow"
# Explicit match is sometimes clearer than if-let collapse
collapsible_match = "allow"
# Explicit match is sometimes clearer than let-else
manual_let_else = "allow"
# Option/Result wrapping can be intentional for API consistency
unnecessary_wraps = "allow"
# Doc style preference
doc_link_with_quotes = "allow"
# push_str(format!()) is acceptable
format_push_string = "allow"
# Sometimes explicit else blocks are clearer
redundant_else = "allow"
# Recursive methods naturally have this
only_used_in_recursion = "allow"
self_only_used_in_recursion = "allow"
# Explicit arms are sometimes clearer
match_wildcard_for_single_variants = "allow"
# Sometimes index variable is needed for context
needless_range_loop = "allow"
# from_str method doesn't always match FromStr trait
should_implement_trait = "allow"
# Sometimes needed for unused bindings
used_underscore_binding = "allow"
# Test sources and fixtures use uniform `r#"..."#` raw strings for consistency
needless_raw_string_hashes = "allow"
