[workspace]
members = ["wado-compiler", "wado-cli", "wado-from-wit", "wado-bundled", "datatest-mini"]
resolver = "3" # v3 resolver

[workspace.package]
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
anyhow = { version = "1" }
fluent-uri = { version = "0.4" }
glob = { version = "0.3" }
indexmap = { version = "2" }
ryu = { version = "1.0.22", features = ["small"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
wat = { version = "1.244" }
wasm-encoder = { version = "0.244" }
wasmparser = { version = "0.244" }
wasmprinter = { version = "0.244" }
wit-parser = { version = "0.244" }
wasmtime = { version = "41", features = ["async", "component-model", "component-model-async"] }
wasmtime-wasi = { version = "41", features = ["p3"] }
assert_cmd = { version = "2" }
heck = { version = "0.5" }
lexopt = { version = "0.3.1" }
predicates = { version = "3" }
regex = { version = "1" }
tempfile = { version = "3" }
jsonschema = { version = "0.39" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
