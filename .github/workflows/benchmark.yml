name: Benchmark

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: write      # push benchmark data to gh-pages
  pull-requests: write # post regression comments on PRs

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out the vendored wasmtime fork (path dependency)
        run: git submodule update --init --depth 1 vendor/wasmtime

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - uses: Swatinem/rust-cache@v2

      - name: Build wado
        run: cargo build --release --bin wado

      - name: Run runtime benchmarks
        run: node .github/scripts/run_wado_benchmarks.ts > runtime-benchmark.json

      - name: Run wasm-size benchmarks
        run: node .github/scripts/run_wado_wasm_size.ts > wasm-size-benchmark.json

      - name: Force-fetch gh-pages branch
        run: git fetch origin gh-pages:gh-pages --force

      # ── main branch: record data only, no alerts ──────────────────────────

      - name: Store runtime benchmark data
        if: github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customBiggerIsBetter
          output-file-path: runtime-benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks/runtime-throughput
          skip-fetch-gh-pages: true

      - name: Store wasm-size benchmark data
        if: github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: wasm-size-benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks/wasm-size
          skip-fetch-gh-pages: true

      - name: Deploy combined benchmark pages
        if: github.event_name == 'push'
        run: |
          git worktree add /tmp/gh-pages gh-pages
          mkdir -p /tmp/gh-pages/benchmarks/runtime-throughput
          cp .github/pages/runtime-index.html /tmp/gh-pages/benchmarks/runtime-throughput/index.html
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/runtime-throughput/index.html
          git diff --cached --quiet || {
            git commit -m "Deploy combined benchmark graphs"
            git push origin gh-pages
          }
          cd -
          git worktree remove /tmp/gh-pages

      # ── PRs: compare against baseline, comment + fail on regression ───────

      - name: Compare runtime benchmarks
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customBiggerIsBetter
          output-file-path: runtime-benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          save-data-file: false
          comment-on-alert: true
          fail-on-alert: true
          alert-threshold: '150%'
          fail-threshold: '200%'
          alert-comment-cc-users: ''
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks/runtime-throughput
          skip-fetch-gh-pages: true

      - name: Compare wasm-size benchmarks
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: wasm-size-benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          save-data-file: false
          comment-on-alert: true
          fail-on-alert: true
          alert-threshold: '110%'
          fail-threshold: '130%'
          alert-comment-cc-users: ''
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks/wasm-size
          skip-fetch-gh-pages: true
