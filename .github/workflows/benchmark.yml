name: Benchmark

# Records two deterministic measures on gh-pages for every push to main: fuel
# (the Wasm instructions a region of a `test "fuel"` block ran, at -O1, -O2 and
# -O3) and wasm size. Nothing here gates a pull request: CI's `test-fuel` job
# holds fuel to `benchmark/fuel.json` exactly. Wall-clock comparison against
# other implementations stays local (`mise run benchmark-all`), since a shared
# runner cannot time it reliably.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

# Two concurrent writers race on the gh-pages tip, so runs share one group and
# are never cancelled: one killed mid-write loses its data.
concurrency:
  group: benchmark-gh-pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # push benchmark data to gh-pages

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wado
        run: cargo build --locked --bin wado

      # What main measures, even where it drifted from the baseline (two pull
      # requests each updating it).
      - name: Run fuel benchmarks
        run: node benchmark/fuel.ts series > fuel-benchmark.json

      - name: Run wasm-size benchmarks
        run: node .github/scripts/run_wado_wasm_size.ts > wasm-size-benchmark.json

      - name: Force-fetch gh-pages branch
        run: git fetch origin gh-pages:gh-pages --force

      - name: Store fuel benchmark data
        uses: benchmark-action/github-action-benchmark@v1
        with:
          # `SUITE` in .github/pages/fuel-index.html, changed with the prices
          # in wado-host/src/fuel.rs.
          name: Fuel v2
          tool: customSmallerIsBetter
          output-file-path: fuel-benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks/fuel
          skip-fetch-gh-pages: true

      - name: Store wasm-size benchmark data
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: wasm-size-benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks/wasm-size
          skip-fetch-gh-pages: true

      - name: Deploy combined benchmark pages
        run: |
          git worktree add /tmp/gh-pages gh-pages
          mkdir -p /tmp/gh-pages/benchmarks/fuel
          mkdir -p /tmp/gh-pages/benchmarks/wasm-size
          cp .github/pages/fuel-index.html /tmp/gh-pages/benchmarks/fuel/index.html
          cp .github/pages/wasm-size-index.html /tmp/gh-pages/benchmarks/wasm-size/index.html
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/fuel/index.html benchmarks/wasm-size/index.html
          git diff --cached --quiet || {
            git commit -m "Deploy combined benchmark graphs"
            git push origin gh-pages
          }
          cd -
          git worktree remove /tmp/gh-pages
