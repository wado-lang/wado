name: Benchmark

# Both measures are deterministic: fuel (the Wasm instructions a region of a
# `test "fuel"` block ran) and wasm size. A pull request fails when fuel
# differs from `benchmark/fuel.json` at all; a push to main records both on
# gh-pages. Wall-clock comparison against other implementations stays local
# (`mise run benchmark-all`), since a shared runner cannot time it reliably.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

# Only push events write to gh-pages, and two concurrent writers race on the
# branch tip, so push runs share one group and are never cancelled: one killed
# mid-write loses its data. Pull-request runs only read gh-pages, so they group
# per ref and a new push cancels the run it supersedes.
concurrency:
  group: benchmark-gh-pages-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: write      # push benchmark data to gh-pages
  pull-requests: write # post regression comments on PRs

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wado
        run: cargo build --locked --bin wado

      # A push records what main measures even where it drifted from the
      # baseline (two pull requests each updating it); the pull request gate
      # is what holds the baseline.
      - name: Run fuel benchmarks
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            node benchmark/fuel.ts check > fuel-benchmark.json
          else
            node benchmark/fuel.ts series > fuel-benchmark.json
          fi

      - name: Run wasm-size benchmarks
        run: node .github/scripts/run_wado_wasm_size.ts > wasm-size-benchmark.json

      - name: Force-fetch gh-pages branch
        run: git fetch origin gh-pages:gh-pages --force

      # ── main branch: record data only, no alerts ──────────────────────────

      - name: Store fuel benchmark data
        if: github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: fuel-benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks/fuel
          skip-fetch-gh-pages: true

      - name: Store wasm-size benchmark data
        if: github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: wasm-size-benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks/wasm-size
          skip-fetch-gh-pages: true

      - name: Deploy combined benchmark pages
        if: github.event_name == 'push'
        run: |
          git worktree add /tmp/gh-pages gh-pages
          mkdir -p /tmp/gh-pages/benchmarks/fuel
          mkdir -p /tmp/gh-pages/benchmarks/wasm-size
          cp .github/pages/fuel-index.html /tmp/gh-pages/benchmarks/fuel/index.html
          cp .github/pages/wasm-size-index.html /tmp/gh-pages/benchmarks/wasm-size/index.html
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/fuel/index.html benchmarks/wasm-size/index.html
          git diff --cached --quiet || {
            git commit -m "Deploy combined benchmark graphs"
            git push origin gh-pages
          }
          cd -
          git worktree remove /tmp/gh-pages

      # ── PRs: compare wasm size against baseline, comment + fail on regression

      - name: Compare wasm-size benchmarks
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: wasm-size-benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          save-data-file: false
          comment-on-alert: true
          fail-on-alert: true
          alert-threshold: '110%'
          fail-threshold: '130%'
          alert-comment-cc-users: ''
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks/wasm-size
          skip-fetch-gh-pages: true
