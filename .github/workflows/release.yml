name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write   # to create / update the GitHub Release

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # On workflow_dispatch, github.ref is the default branch — check
          # out the requested tag instead so validate/build see the tagged
          # source, not main.
          ref: ${{ inputs.tag || github.ref }}

      - name: Determine version from tag
        id: v
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml and wado.toml versions match the tag
        shell: bash
        run: |
          version="${{ steps.v.outputs.version }}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag version '$version' is not a MAJOR.MINOR.PATCH release"
            exit 1
          fi
          workspace_version() {
            awk '
              /^\[/ { in_wp = ($0 == "[workspace.package]"); next }
              in_wp && /^version[[:space:]]*=/ {
                v = $0
                sub(/^version[[:space:]]*=[[:space:]]*"/, "", v)
                sub(/".*/, "", v)
                print v
                exit
              }
            ' "$1"
          }
          cargo_v="$(workspace_version Cargo.toml)"
          wado_v="$(workspace_version wado.toml)"
          fail=0
          [ "$cargo_v" = "$version" ] || { echo "::error::Cargo.toml [workspace.package].version '$cargo_v' != tag '$version'"; fail=1; }
          [ "$wado_v"  = "$version" ] || { echo "::error::wado.toml [workspace.package].version '$wado_v' != tag '$version'"; fail=1; }
          exit $fail

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # `asset_id` matches `$(uname -s | tr A-Z a-z)-$(uname -m)` on the
          # host platform so that install scripts can use `uname` output
          # directly without an arch/os normalization table. Note that macOS
          # `uname -m` returns `arm64` (not `aarch64`).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
            archive: tar.gz
            asset_id: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm     # native ARM runner; no `*-latest` alias exists
            ext: ''
            archive: tar.gz
            asset_id: linux-aarch64
          - target: aarch64-apple-darwin
            os: macos-latest         # `macos-latest` is Apple Silicon since macos-14
            ext: ''
            archive: tar.gz
            asset_id: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: '.exe'
            archive: zip
            asset_id: windows-x86_64
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm       # native ARM Windows runner; no `*-latest` alias
            ext: '.exe'
            archive: zip
            asset_id: windows-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust target
        # rust-toolchain.toml is honored automatically by rustup; we only
        # need to add the target triple when it differs from the runner's
        # native architecture.
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build wado
        run: cargo build --release -p wado-cli --target ${{ matrix.target }}

      - name: Stage artifacts
        shell: bash
        run: |
          # Keep the asset basename version-free so that
          # `releases/latest/download/<name>` URLs resolve to the most
          # recent release without needing to embed the version.
          name="wado-${{ matrix.asset_id }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/wado${{ matrix.ext }}" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          echo "STAGE_NAME=$name" >> "$GITHUB_ENV"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd dist
          tar czf "$STAGE_NAME.tar.gz" "$STAGE_NAME"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/$env:STAGE_NAME" `
                           -DestinationPath "dist/$env:STAGE_NAME.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/wado-*.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Compute SHA256SUMS
        run: |
          cd dist
          sha256sum wado-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # tagpr creates the release as a draft (see `.tagpr`). The repository
      # has "Immutable releases" enabled, which forbids uploading assets to
      # a published release — assets must go onto a draft. action-gh-release@v3
      # uploads files before flipping draft=false, so leaving `draft` unset
      # (default false) uploads to the existing draft and then publishes it.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/wado-*.tar.gz
            dist/wado-*.zip
            dist/SHA256SUMS.txt

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download the release binary built by the build job
        uses: actions/download-artifact@v8
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist

      - name: Unpack wado onto PATH
        run: |
          tar xzf dist/wado-linux-x86_64.tar.gz -C dist
          echo "$PWD/dist/wado-linux-x86_64" >> "$GITHUB_PATH"

      - uses: cargo-bins/cargo-binstall@main
      - name: Install wkg
        run: cargo binstall --no-confirm wkg

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Wado packages
        run: wado publish

  deploy-site:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Generate a token scoped to the site repository
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: "${{ secrets.GH_APP_ID }}"
          private-key: "${{ secrets.GH_APP_PRIVATE_KEY }}"
          owner: wado-lang
          repositories: wado-lang.github.io
          permission-contents: write

      - name: Trigger the wado-lang.github.io deploy
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
        run: gh api repos/wado-lang/wado-lang.github.io/dispatches -f event_type=deploy
