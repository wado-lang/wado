name: tagpr

on:
  push:
    branches: [main]

permissions:
  contents: read

# Two runs at once race: the one that finishes last commits a Cargo.lock synced
# against its own, possibly older, checkout onto the latest main.
concurrency:
  group: tagpr
  cancel-in-progress: true

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: "${{ secrets.GH_APP_ID }}"
          private-key: "${{ secrets.GH_APP_PRIVATE_KEY }}"
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          # tagpr needs the full history to compute the changelog.
          fetch-depth: 0
          token: "${{ steps.app-token.outputs.token }}"

      - uses: Songmu/tagpr@v1.21.0
        env:
          GITHUB_TOKEN: "${{ steps.app-token.outputs.token }}"
