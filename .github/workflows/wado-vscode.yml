name: wado-vscode

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded pull-request run holds runners the next push needs. A run on main
# is that commit's record, so it finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The bundled Wasm language server the extension loads on activation (see
  # docs/wep-2026-04-18-lsp-architecture.md) is the same file on every
  # platform, so it is built once here and handed to the others.
  test-wado-vscode:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # The job runs the pull request's own code, which would otherwise read
      # the token out of `.git/config`.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The Rust-only task: the composite action below compiles the TS bundle.
      - name: Build wado-lsp.wasm (wasm32-wasip1)
        run: mise run build-wado-lsp-wasm-rust
      - uses: actions/upload-artifact@v7
        with:
          name: wado-lsp-wasm
          path: wado-vscode/out/wado_lsp.wasm
          if-no-files-found: error

      - uses: ./.github/actions/wado-vscode-test

  test-wado-vscode-elsewhere:
    name: ${{ matrix.os }}
    needs: test-wado-vscode
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: wado-lsp-wasm
          path: wado-vscode/out

      - uses: ./.github/actions/wado-vscode-test
