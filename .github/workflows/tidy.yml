name: Tidy

on:
  pull_request:
    branches: [main]

concurrency:
  group: tidy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  tidy:
    name: Tidy
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: "${{ secrets.GH_APP_ID }}"
          private-key: "${{ secrets.GH_APP_PRIVATE_KEY }}"
          permission-contents: write

      - uses: actions/checkout@v6
        with:
          token: "${{ steps.app-token.outputs.token }}"
          ref: "${{ github.head_ref }}"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - uses: jdx/mise-action@v3
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_VERBOSE: ${{ runner.debug }}

      - run: mise run clippy-fix
      - run: cargo build --bin wado --bin wado-dev-tools
      - run: mise run update-golden-fixtures
      - run: mise run update-golden-format-fixtures
      - run: mise run doc-stdlib
      - run: mise run format

      - name: Commit and push changes
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
          APP_SLUG: "${{ steps.app-token.outputs.app-slug }}"
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Working tree is clean"
            exit 0
          fi
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "chore: tidy"
          git push
