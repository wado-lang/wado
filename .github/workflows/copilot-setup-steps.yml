name: "Copilot Setup Steps"

# Run automatically when this file changes (validates the setup), and allow
# manual runs from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

env:
  CARGO_TERM_COLOR: always

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      # Fast linker — matches the CI setup
      - uses: rui314/setup-mold@v1

      # Cache Rust build artifacts. Use a dedicated key so this cache is
      # always saved and available for the agent, independently of CI runs.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: copilot

      # Install project tools via mise (wasmtime, node, …).
      # mise-action handles its own tool cache internally when cache: true.
      - uses: jdx/mise-action@v3
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_VERBOSE: ${{ runner.debug }}

      # Pre-build all workspace crates so that Rust build artifacts are
      # already in the cache when the agent starts working.
      - name: Build Rust workspace
        run: cargo build --workspace --locked
