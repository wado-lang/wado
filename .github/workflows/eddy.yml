name: Eddy

# Reviews a pull request with Eddy (package-eddy/) and posts the findings as
# one comment. A repository admin starts it, by commenting `@wado-bot review`
# on the pull request or by dispatching it with the pull request's number. An
# admin's pull request also gets one where CodeRabbit's review limit leaves its
# head unreviewed.
on:
  issue_comment:
    types: [created]
  # CodeRabbit's comment may be cut short of its reason, so its commit status
  # is what says a review was rate limited.
  status:
  workflow_dispatch:
    inputs:
      pr:
        description: The number of the pull request to review.
        required: true
        type: number

permissions: {}

jobs:
  # Who asked, and the commit the review is of. The head is fixed here, so a
  # push during the review does not change what the comment reports on.
  gate:
    name: Gate
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.issue.pull_request && startsWith(github.event.comment.body, '@wado-bot review'))
      || (github.event_name == 'status' && github.event.context == 'CodeRabbit'
      && github.event.description == 'Review rate limited' && github.event.sender.login == 'coderabbitai[bot]')
    runs-on: ubuntu-latest
    # A rate-limited status reads the head's `Eddy` check, and its gate writes
    # one, so two for one head go one at a time.
    concurrency:
      group: eddy-gate-${{ github.event_name == 'status' && github.event.sha || github.run_id }}
    permissions:
      actions: read
      checks: write
      contents: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      sha: ${{ steps.pr.outputs.sha }}
      check: ${{ steps.check.outputs.id }}
      eddy-run: ${{ steps.eddy.outputs.run }}
      eddy-sha: ${{ steps.eddy.outputs.sha }}
      attempt: ${{ github.run_attempt }}
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: "${{ secrets.GH_APP_ID }}"
          private-key: "${{ secrets.GH_APP_PRIVATE_KEY }}"
      - id: pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          # A re-run keeps the event and `github.actor` of the run it repeats.
          REQUESTER: ${{ github.event.comment.user.login || github.actor }}
          RERUNNER: ${{ github.triggering_actor != github.actor && github.triggering_actor || '' }}
          PR: ${{ github.event.issue.number || inputs.pr }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RATE_LIMITED_SHA: ${{ github.event_name == 'status' && github.event.sha || '' }}
          CHECKS_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Nobody asked for a rate-limited head's review, so the pull request's
          # author stands as the one who did. A status that calls for no review
          # is passed over, not failed.
          author=
          pass_over_author() {
            echo "::notice::#$PR is $author's, so a repository admin asks for its review"
            GH_TOKEN="$CHECKS_TOKEN" gh api -X POST "repos/$REPO/check-runs" -f name=Eddy -f head_sha="$sha" \
              -f status=completed -f conclusion=skipped -f details_url="$RUN" > /dev/null
            exit 0
          }
          if [ -n "$RATE_LIMITED_SHA" ]; then
            sha="$RATE_LIMITED_SHA"
            pull="$(gh api "repos/$REPO/commits/$sha/pulls" \
              --jq ".[] | select(.state == \"open\" and .head.sha == \"$sha\") | \"\(.number) \(.user.login) \(.user.type)\"")"
            read -r PR author type <<< "$pull"
            if [ -z "$PR" ]; then
              echo "::notice::${sha:0:9} is the head of no open pull request"
              exit 0
            fi
            # A re-run is an admin asking again.
            if [ -z "$RERUNNER" ]; then
              taken="$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=Eddy" --jq '.check_runs[].id')"
              if [ -n "$taken" ]; then
                echo "::notice::Eddy has already taken ${sha:0:9}"
                exit 0
              fi
            fi
            # A bot has no permission to look up.
            if [ "$type" != User ]; then
              pass_over_author
            fi
            REQUESTER="$author"
          else
            sha="$(gh pr view "$PR" -R "$REPO" --json headRefOid --jq .headRefOid)"
          fi
          # A review builds and runs the pull request's code, and is paid for,
          # so only an owner starts one.
          for actor in $REQUESTER $RERUNNER; do
            permission="$(gh api "repos/$REPO/collaborators/$actor/permission" --jq .permission)"
            if [ "$permission" != admin ]; then
              if [ "$actor" = "$author" ]; then
                pass_over_author
              fi
              echo "::error::Eddy is started by a repository admin; $actor has $permission"
              exit 1
            fi
          done
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -n "$COMMENT_ID" ]; then
            gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes > /dev/null
          fi
      # The `wado` that runs Eddy is the one main's CI built, so the review
      # builds no second target directory beside the reviewer's. Eddy is taken
      # from the commit that run built, so the two match. A docs-only run
      # builds nothing, so the newest run with the binary is the one taken.
      # That commit may predate this workflow's, so it is taken only where the
      # files the review runs from it are this workflow's commit's.
      - id: eddy
        if: steps.pr.outputs.sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_from() {
            gh api "repos/$REPO/contents?ref=$1" \
              --jq '.[] | select(.name | IN("package-eddy", "mise.toml", "tools")) | "\(.name) \(.sha)"'
            gh api "repos/$REPO/contents/.github?ref=$1" --jq '.[] | select(.name == "actions") | .sha'
          }
          wanted="$(run_from "$GITHUB_SHA")"
          runs="$(gh run list -R "$REPO" -w ci.yml -b main -e push -s success -L 20 \
            --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"')"
          while read -r run sha; do
            [ -n "$run" ] || continue
            if [ -n "$(gh api "repos/$REPO/actions/runs/$run/artifacts" \
              --jq '.artifacts[] | select(.name == "prebuilt-wado" and (.expired | not)) | .id')" ]; then
              if [ "$(run_from "$sha")" != "$wanted" ]; then
                echo "::error::main's CI has not yet built a wado for Eddy as of ${GITHUB_SHA:0:9}; ask again once it has"
                exit 1
              fi
              echo "run=$run" >> "$GITHUB_OUTPUT"
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$runs"
          echo "::error::no recent CI run on main kept a prebuilt wado"
          exit 1
      # The mark a rate-limited status reads, so a head CodeRabbit reports
      # twice, or one an admin already asked about, is reviewed once.
      - id: check
        if: steps.pr.outputs.sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.pr.outputs.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          id="$(gh api -X POST "repos/$REPO/check-runs" -f name=Eddy -f head_sha="$SHA" \
            -f status=in_progress -f details_url="$RUN" --jq .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # Eddy and everything around it come from main: the pull request's own
  # scripts, mise.toml or Eddy would run outside the sandbox, in a job that can
  # mint the API token. The pull request is only the commit under review, and
  # its code runs only inside Eddy's confinement. No GitHub token reaches this
  # job past the setup.
  review:
    name: Review
    needs: gate
    if: needs.gate.outputs.sha
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: eddy-${{ needs.gate.outputs.pr }}
    env:
      SHA: ${{ needs.gate.outputs.sha }}
    steps:
      # A re-run of this job alone keeps the gate of an earlier attempt, so no
      # one would have checked who re-ran it.
      - if: needs.gate.outputs.attempt != github.run_attempt
        run: |
          echo "::error::Eddy runs only with its gate; re-run the whole workflow"
          exit 1
      # Where `build-wado` checked out, since the binary holds its paths.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.eddy-sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --quiet --no-tags origin "$SHA"
      # The reviewer's builds fill the target directory.
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache: false
          prebuilt: wado
          prebuilt-run-id: ${{ needs.gate.outputs.eddy-run }}
      # Eddy reads `rg` and `git` from /usr/bin.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      # The reviewer's cargo cannot write the cargo or rustup homes, so the
      # crates the commit names are fetched first. A fetch builds nothing, but
      # rustup and cargo also obey the files around the directory they run in:
      # a `rust-toolchain.toml` naming a `path` toolchain runs the commit's own
      # `cargo`, and `.cargo/config.toml` can name a credential provider. So
      # the fetch runs from outside the commit's tree, on main's toolchain.
      - run: |
          set -euo pipefail
          toolchain="$(rustup show active-toolchain | cut -d' ' -f1)"
          git worktree add --quiet --detach "$RUNNER_TEMP/head" "$SHA"
          (cd "$RUNNER_TEMP" && cargo "+$toolchain" fetch --locked --manifest-path head/Cargo.toml)
          git worktree remove --force "$RUNNER_TEMP/head"
      # Workload Identity Federation, so no API key is stored: Eddy mints its
      # tokens from the job's identity. The rule accepts only this workflow on
      # main, which starts only for an admin: on their comment or dispatch, or
      # on their own pull request.
      - id: eddy
        env:
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01N2UzGtpPyqSMQz3htMdLce
          ANTHROPIC_ORGANIZATION_ID: b5accdd0-f052-4fe6-88e6-65bc34d1cba9
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01WVnWQoBfyRFsf4wyM7EHq7
          ANTHROPIC_WORKSPACE_ID: wrkspc_01Ug39YtMABrbjfon1tEpoXy
        run: |
          mkdir -p scratchpad
          status=0
          mise run eddy-review --head "$SHA" > scratchpad/eddy.json 2> scratchpad/eddy.log || status=$?
          cat scratchpad/eddy.log
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eddy-${{ needs.gate.outputs.pr }}-${{ env.SHA }}
          path: |
            scratchpad/eddy.json
            scratchpad/eddy.log
            scratchpad/eddy/${{ env.SHA }}/
            scratchpad/wiki/reviews/${{ env.SHA }}/
          retention-days: 90
          if-no-files-found: warn

  post:
    name: Post
    needs: [gate, review]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.sha
    runs-on: ubuntu-latest
    # The wiki, which holds the records, is written with the contents grant.
    permissions:
      checks: write
      contents: write
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: "${{ secrets.GH_APP_ID }}"
          private-key: "${{ secrets.GH_APP_PRIVATE_KEY }}"
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: eddy-${{ needs.gate.outputs.pr }}-${{ needs.gate.outputs.sha }}
          path: scratchpad
      - id: comment
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.pr }}
          SHA: ${{ needs.gate.outputs.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/body.md"
          comment="scratchpad/eddy/$SHA/review.md"
          if [ -f "$comment" ]; then
            cp "$comment" "$body"
          else
            # Eddy stopped before it could write the comment.
            {
              echo "## Eddy"
              echo
              echo "The review of \`${SHA:0:9}\` did not finish."
              if [ -f scratchpad/eddy.log ]; then
                echo
                echo '```'
                grep -E '^(eddy|cost):' scratchpad/eddy.log || true
                echo '```'
              fi
            } > "$body"
          fi
          if [ -d scratchpad ]; then
            printf '\n[The run](%s), and its artifact for the patches.\n' "$RUN" >> "$body"
          else
            printf '\n[The run](%s)\n' "$RUN" >> "$body"
          fi
          gh pr comment "$PR" --repo "$REPO" --body-file "$body"
      # The check says whether Eddy ran and reported, not what it found.
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHECK: ${{ needs.gate.outputs.check }}
          CONCLUSION: >-
            ${{ needs.review.result == 'cancelled' && 'cancelled'
            || needs.review.result == 'success' && steps.comment.outcome == 'success' && 'success'
            || 'failure' }}
        run: |
          gh api -X PATCH "repos/$REPO/check-runs/$CHECK" \
            -f status=completed -f conclusion="$CONCLUSION" > /dev/null
      - env:
          SHA: ${{ needs.gate.outputs.sha }}
          TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          record="scratchpad/wiki/reviews/$SHA"
          if [ ! -d "$record" ]; then
            exit 0
          fi
          git clone --quiet "https://x-access-token:$TOKEN@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.wiki.git" "$RUNNER_TEMP/wiki"
          cd "$RUNNER_TEMP/wiki"
          mkdir -p "reviews/$SHA"
          cp "$GITHUB_WORKSPACE/$record"/*.json "reviews/$SHA/"
          git add reviews
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --quiet --message "Record Eddy's review of $SHA"
          # Another review may have pushed meanwhile; each writes its own file.
          for attempt in 1 2 3; do
            if git push --quiet; then
              exit 0
            fi
            git pull --quiet --rebase
          done
          exit 1
