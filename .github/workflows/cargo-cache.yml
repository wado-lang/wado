# Publishes shared cargo caches to GCS so non-GitHub environments (e.g. the
# Claude Code web container) can restore them. Two objects are produced:
#
#   cargo/registry/linux-x86_64.tar.gz  registry index, .crate files, unpacked sources
#   cargo/sccache/linux-x86_64.tar.gz   sccache content-addressed compile cache
#
# The registry cache saves the download and the unpack; the sccache cache saves
# compiling the ~440 dependencies. See .claude/hooks/cargo-cache-restore.mts
# (consumer) and the `warm-cache` task in mise.toml, which turns it into a warm
# target/ the dev loop then builds on directly.
#
# PATH PARITY IS LOAD-BEARING. sccache's Rust cache key is sensitive to the
# absolute build paths (build-script OUT_DIR and dependency paths bake into it),
# so the runner MUST compile under the exact same absolute paths the container
# uses, or every entry misses. Keep these env values in lockstep with the
# container: repo at /home/user/wado, CARGO_HOME at /root/.cargo, target at
# /home/user/wado/target. sccache itself is the distro build on both sides
# (Ubuntu 24.04 `apt` sccache) so the on-disk cache format matches.
#
# CARGO_* ENV PARITY IS ALSO LOAD-BEARING. sccache hashes every CARGO_* env var
# into the Rust cache key, so this job's CARGO_* set (CARGO_HOME,
# CARGO_TARGET_DIR, CARGO_INCREMENTAL) must match the container's warm-cache
# build (mise.toml) exactly.
#
# Required repo variables (none are secret — all are plain identifiers):
#   vars.GCP_WIF_PROVIDER    workload identity provider resource name
#   vars.GCP_CACHE_WRITER_SA writer service-account email (roles/storage.objectAdmin on the bucket)
#   vars.GCP_CACHE_BUCKET    GCS bucket name (e.g. wado-lang-cache)
name: Cargo caches (registry + sccache)

on:
  push:
    branches: [main]
    # All of these feed the sccache cache key. Without a republish the
    # container silently falls back to a cold build; `warm-cache` reports the
    # hit rate so that stays visible.
    paths:
      - Cargo.lock
      - Cargo.toml
      - "*/Cargo.toml"
      - rust-toolchain.toml
      - .github/workflows/cargo-cache.yml
  workflow_dispatch:

concurrency:
  group: cargo-cache
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  # Mirror the container's absolute paths (see the parity note above).
  CONTAINER_REPO: /home/user/wado
  CARGO_HOME: /root/.cargo
  SCCACHE_DIR: /root/.cargo/sccache
  CARGO_TARGET_DIR: /home/user/wado/target
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  # The default 10 GiB would evict entries and publish a cache with holes.
  SCCACHE_CACHE_SIZE: 30G
  # RUSTFLAGS is a sccache cache-key input; keep it identical to the container's
  # mise [env] (both unset).

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      # `--all-targets` peaks near 13 GB, and path parity pins target/ to the
      # root filesystem. Dropping the preinstalled SDKs buys ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Install sccache (distro build — same version as the container)
        run: sudo apt-get update && sudo apt-get install -y sccache

      - name: Mirror the container's absolute build paths
        run: |
          sudo mkdir -p "$CONTAINER_REPO" "$CARGO_HOME"
          sudo cp -a "$GITHUB_WORKSPACE/." "$CONTAINER_REPO/"
          sudo chown -R "$(id -u):$(id -g)" "$CONTAINER_REPO" "$CARGO_HOME"
          # cargo runs as the unprivileged runner user but writes $CARGO_HOME
          # under /root (0700); make /root traversable so it can.
          sudo chmod o+x /root

      - name: Fetch registry, then compile through sccache
        working-directory: /home/user/wado
        run: |
          cargo fetch --locked
          # Separate cache entries: `check` emits .rmeta, `build` .rlib and
          # the linked binaries. Keep in step with `warm-cache`, which replays
          # this list.
          cargo check --workspace --locked
          cargo build --workspace --locked --all-targets
          sccache --show-stats

      - name: Pack caches (public data only — never credentials.toml / config.toml)
        run: |
          sccache --stop-server || true
          mkdir -p out/registry out/sccache
          # `registry/src` too: without it cargo re-unpacks 374 .crate files
          # on the container's first build.
          tar -C "$CARGO_HOME" -czf out/registry/linux-x86_64.tar.gz \
            registry/index registry/cache registry/src
          # sccache entries are already compressed; `-1` keeps the .tar.gz
          # envelope the restore hook expects without re-compressing them.
          tar -C "$SCCACHE_DIR" -I 'gzip -1' -cf out/sccache/linux-x86_64.tar.gz .
          ls -lh out/registry/linux-x86_64.tar.gz out/sccache/linux-x86_64.tar.gz

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CACHE_WRITER_SA }}

      - name: Upload registry cache
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: out/registry/linux-x86_64.tar.gz
          destination: ${{ vars.GCP_CACHE_BUCKET }}/cargo/registry
          parent: false

      - name: Upload sccache cache
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: out/sccache/linux-x86_64.tar.gz
          destination: ${{ vars.GCP_CACHE_BUCKET }}/cargo/sccache
          parent: false
