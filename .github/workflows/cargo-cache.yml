# Publishes the shared cargo caches every session restores from:
#
#   cargo/registry/linux-x86_64.tar.gz     registry index, .crate files, unpacked sources (GCS)
#   cargo/target-deps/linux-x86_64.tar.gz  the dependency half of target/ (GCS)
#   v0-rust-ci-Linux-x64-*                 ci.yml's target/ and registry (Actions cache)
#
# The registry cache saves the download and the unpack; the target-deps cache
# saves compiling the dependency graph. A session becomes warm by UNPACKING,
# not by rebuilding -- there is no warm-up task any more. See
# .claude/hooks/cargo-cache-restore.mts (consumer) and
# scripts/pack-target-deps.sh (what goes in, and why workspace artifacts do not).
#
# PATH PARITY IS A CORRECTNESS REQUIREMENT. Dependency build scripts record
# absolute paths (`cargo:rustc-link-search=<abs>`: aws-lc-sys, ring,
# libmimalloc-sys, ittapi-sys, wasmtime) and cargo replays those recordings
# rather than re-running the script, while still treating the units as fresh.
# Restored under a different absolute path they point at nothing, and nothing
# self-heals. So the runner MUST build under the exact paths the container uses
# -- repo at /home/user/wado, CARGO_HOME at /root/.cargo, target at
# /home/user/wado/target -- and the restore hook re-checks this against the
# published manifest, failing closed on any mismatch.
#
# The CONFIGURATION SET below is load-bearing. Feature resolution differs
# between builds that include dev-dependencies and those that do not (16
# registry crates change features, which propagates to ~72 units), and again
# between `--workspace` and a single `-p` selection. Each configuration is a
# separate set of artifacts that coexist in target/, so the cache only covers a
# command the runner actually ran. Keep this list in step with the commands
# AGENTS.md tells contributors to use.
#
# CARGO_INCREMENTAL is set to 0 here purely to keep the runner's own disk and
# time down. It does not affect what is published: cargo never passes
# `-C incremental` to a registry dependency, so dependency artifacts and their
# fingerprints are identical either way.
#
# Required repo variables (none are secret — all are plain identifiers):
#   vars.GCP_WIF_PROVIDER    workload identity provider resource name
#   vars.GCP_CACHE_WRITER_SA writer service-account email (roles/storage.objectAdmin on the bucket)
#   vars.GCP_CACHE_BUCKET    GCS bucket name (e.g. wado-lang-cache)
name: Cargo caches

on:
  push:
    branches: [main]
    # All of these feed the cache contents. Without a republish the session
    # falls back to compiling whatever drifted.
    paths:
      - Cargo.lock
      - Cargo.toml
      - "*/Cargo.toml"
      - rust-toolchain.toml
      - scripts/pack-target-deps.sh
      - .github/workflows/cargo-cache.yml
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: cargo-cache
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Mirror the container's absolute paths (see the parity note above).
      CONTAINER_REPO: /home/user/wado
      CARGO_HOME: /root/.cargo
      CARGO_TARGET_DIR: /home/user/wado/target
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      # `--all-targets` builds every test binary, and path parity pins target/
      # to the root filesystem. Dropping the preinstalled SDKs buys the headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Mirror the container's absolute build paths
        run: |
          sudo mkdir -p "$CONTAINER_REPO" "$CARGO_HOME"
          sudo cp -a "$GITHUB_WORKSPACE/." "$CONTAINER_REPO/"
          sudo chown -R "$(id -u):$(id -g)" "$CONTAINER_REPO" "$CARGO_HOME"
          # cargo runs as the unprivileged runner user but writes $CARGO_HOME
          # under /root (0700); make /root traversable so it can.
          sudo chmod o+x /root

      - name: Build every configuration the dev loop uses
        working-directory: /home/user/wado
        run: |
          cargo fetch --locked
          # Disjoint artifact sets, none derived from another. See the
          # configuration note above before trimming this list.
          cargo check --workspace --locked
          cargo build --workspace --locked --all-targets
          cargo build --workspace --locked
          cargo check -p wado-compiler --locked
          cargo check -p wado-lsp --locked
          cargo check -p wado-manifest --locked
          # `mise run build`'s cross-target checks.
          cargo check -p wado-compiler --locked --target wasm32-unknown-unknown
          cargo check -p wado-lsp --locked --target wasm32-unknown-unknown
          cargo check -p wado-manifest --locked --target wasm32-unknown-unknown
          df -h /

      - name: Pack caches (public data only — never credentials.toml / config.toml)
        working-directory: /home/user/wado
        run: |
          mkdir -p out/registry out/target-deps
          # `registry/src` too: without it cargo re-unpacks every .crate file
          # on the container's first build.
          tar -C "$CARGO_HOME" -czf out/registry/linux-x86_64.tar.gz \
            registry/index registry/cache registry/src
          scripts/pack-target-deps.sh \
            "$PWD/out/target-deps/linux-x86_64.tar.gz" \
            "$PWD/out/target-deps/linux-x86_64.manifest.json"
          ls -lh out/registry/linux-x86_64.tar.gz out/target-deps/linux-x86_64.tar.gz

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CACHE_WRITER_SA }}

      - name: Upload registry cache
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: /home/user/wado/out/registry/linux-x86_64.tar.gz
          destination: ${{ vars.GCP_CACHE_BUCKET }}/cargo/registry
          parent: false

      # The tarball goes up before the manifest: the hook reads the manifest
      # first, so a half-published pair must never look complete.
      - name: Upload target-deps cache
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: /home/user/wado/out/target-deps/linux-x86_64.tar.gz
          destination: ${{ vars.GCP_CACHE_BUCKET }}/cargo/target-deps
          parent: false

      - name: Upload target-deps manifest
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: /home/user/wado/out/target-deps/linux-x86_64.manifest.json
          destination: ${{ vars.GCP_CACHE_BUCKET }}/cargo/target-deps
          parent: false

  actions-cache:
    name: Warm ci.yml's Actions cache
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - run: cargo build --workspace --locked --all-targets
