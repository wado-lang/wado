name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test-core:
    name: Test (Core)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check out the vendored wasmtime fork (path dependency)
        run: git submodule update --init --depth 1 vendor/wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - uses: rui314/setup-mold@v1

      - run: cargo test --locked --all -- --skip fixture_test_

  test-e2e-o0:
    name: Test (E2E O0)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check out the vendored wasmtime fork (path dependency)
        run: git submodule update --init --depth 1 vendor/wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - uses: rui314/setup-mold@v1

      - run: cargo test --locked -p wado-compiler --test e2e -- fixture_test_o0

  test-e2e-o1:
    name: Test (E2E O1)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check out the vendored wasmtime fork (path dependency)
        run: git submodule update --init --depth 1 vendor/wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - uses: rui314/setup-mold@v1

      - run: cargo test --locked -p wado-compiler --test e2e -- fixture_test_o1

  test-e2e-o2:
    name: Test (E2E O2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check out the vendored wasmtime fork (path dependency)
        run: git submodule update --init --depth 1 vendor/wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - uses: rui314/setup-mold@v1

      - run: cargo test --locked -p wado-compiler --test e2e -- fixture_test_o2

  test-e2e-o3:
    name: Test (E2E O3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check out the vendored wasmtime fork (path dependency)
        run: git submodule update --init --depth 1 vendor/wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - uses: rui314/setup-mold@v1

      - run: cargo test --locked -p wado-compiler --test e2e -- fixture_test_o3

  test-e2e-os:
    name: Test (E2E Os)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check out the vendored wasmtime fork (path dependency)
        run: git submodule update --init --depth 1 vendor/wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - uses: rui314/setup-mold@v1

      - run: cargo test --locked -p wado-compiler --test e2e -- fixture_test_os

  test-wado:
    name: Test (Wado)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check out the vendored wasmtime fork (path dependency)
        run: git submodule update --init --depth 1 vendor/wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - uses: rui314/setup-mold@v1

      - uses: jdx/mise-action@v4
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_VERBOSE: ${{ runner.debug }}

      - run: mise run test-wado

  test-gale-o1:
    name: Test (Gale O1)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check out the vendored wasmtime fork (path dependency)
        run: git submodule update --init --depth 1 vendor/wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - uses: rui314/setup-mold@v1

      - uses: jdx/mise-action@v4
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_VERBOSE: ${{ runner.debug }}

      - run: mise run test-gale-o1

  test-gale-o2:
    name: Test (Gale O2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check out the vendored wasmtime fork (path dependency)
        run: git submodule update --init --depth 1 vendor/wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - uses: rui314/setup-mold@v1

      - uses: jdx/mise-action@v4
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_VERBOSE: ${{ runner.debug }}

      - run: mise run test-gale-o2

  test-gale-o3:
    name: Test (Gale O3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check out the vendored wasmtime fork (path dependency)
        run: git submodule update --init --depth 1 vendor/wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - uses: rui314/setup-mold@v1

      - uses: jdx/mise-action@v4
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_VERBOSE: ${{ runner.debug }}

      - run: mise run test-gale-o3

  check-wasm32:
    name: Check (wasm32)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check out the vendored wasmtime fork (path dependency)
        run: git submodule update --init --depth 1 vendor/wasmtime
      - run: cargo check --locked -p wado-compiler --target wasm32-unknown-unknown

  check-deps:
    name: Check (Deps aligned)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check out the vendored wasmtime fork (path dependency)
        run: git submodule update --init --depth 1 vendor/wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false

      - uses: jdx/mise-action@v4
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_VERBOSE: ${{ runner.debug }}

      - run: mise run check-deps

  test:
    name: Test
    if: always()
    needs:
      [
        test-core,
        test-wado,
        test-gale-o1,
        test-gale-o2,
        test-gale-o3,
        test-e2e-o0,
        test-e2e-o1,
        test-e2e-o2,
        test-e2e-o3,
        test-e2e-os,
        check-wasm32,
        check-deps,
      ]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check all jobs passed
        run: |
          results="${{ needs.test-core.result }} ${{ needs.test-wado.result }} ${{ needs.test-gale-o1.result }} ${{ needs.test-gale-o2.result }} ${{ needs.test-gale-o3.result }} ${{ needs.test-e2e-o0.result }} ${{ needs.test-e2e-o1.result }} ${{ needs.test-e2e-o2.result }} ${{ needs.test-e2e-o3.result }} ${{ needs.test-e2e-os.result }} ${{ needs.check-wasm32.result }} ${{ needs.check-deps.result }}"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "One or more jobs failed"
              exit 1
            fi
          done
          echo "All CI checks passed"
