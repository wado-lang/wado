name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded pull-request run holds runners the next push needs. A run on main
# is that commit's record, so it finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # A change to Markdown no gate reads skips every test job below, and the
  # aggregator `test` reports success on their behalf.
  #
  # The skip is a job-level `if`, not a workflow-level `paths-ignore`: a
  # path-ignored workflow never creates the "Test" check run, so the required
  # check would stay stuck "Expected" and block the PR. A job-level skip counts
  # as passing.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Every checkout below passes `persist-credentials: false`: a job runs the
      # pull request's own code, which would otherwise read the token out of
      # `.git/config`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-$BEFORE_SHA}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base ref; running full CI."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "${base}...HEAD")"
          echo "Changed files:"
          echo "$files"
          # Feed grep a here-string, not `printf | grep -q`: under `pipefail`
          # `grep -q` exits at the first match, the producer dies of SIGPIPE, and
          # pipefail reports the pipeline as failed — misclassifying a large diff
          # as docs-only and skipping every test job.
          # `check-spec-examples` reads the specification and the WEPs, so a
          # change to either is code.
          if [ -z "$files" ] || grep -qvE '\.md$' <<< "$files" \
            || grep -qE '^docs/(spec|wep)-[^/]*\.md$' <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping test jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The binaries the test jobs run, each compiled once per run and handed over
  # as an artifact. The runners' concurrency cap, not any one job, is what a run
  # waits on, so a compile repeated per job is paid for in queue time: `wado`
  # was compiled nine times a run and the e2e binary five.
  #
  # The jobs that compile more start from this one's target/, so the workspace
  # compiles once too. `mise run check-unit-graph` keeps their feature
  # resolution the same as this build's, without which they would share no unit.
  build-wado:
    name: Build (wado)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # cargo-cache.yml builds this same command, so only the workspace crates
      # compile here.
      - run: node scripts/prebuilt.ts build wado
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt-wado
          path: |
            target/debug/wado
            target/debug/wado-dev-tools
          if-no-files-found: error
      - uses: ./.github/actions/target-handoff
        with:
          mode: save

  build-e2e:
    name: Build (E2E)
    needs: [changes, build-wado]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/target-handoff
        with:
          mode: restore

      - run: node scripts/prebuilt.ts build e2e
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt-e2e
          path: target/debug/e2e
          if-no-files-found: error

  # The Rust tests, preceded by the static gates: each gate is sub-minute, so a
  # Cargo.lock drift, a hook break, an internal-name regression, or a wasm32
  # break fails long before `cargo test` finishes.
  #
  # wado-compiler, wado-lsp, and wado-manifest must compile for wasm32 so the
  # compiler and the LSP engine can run in the browser (the playground), with
  # every I/O call delegated to the wado-cli host.
  test-core:
    name: Test (Rust)
    needs: [changes, build-wado]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/target-handoff
        with:
          mode: restore

      - run: mise run check-deps
      - run: mise run check-unit-graph
      - run: mise run test-hooks
      - run: mise run check-review-filters
      - run: cargo check --locked -p wado-compiler --target wasm32-unknown-unknown
      - run: cargo check --locked -p wado-lsp --target wasm32-unknown-unknown
      - run: cargo check --locked -p wado-manifest --target wasm32-unknown-unknown

      - run: cargo test --locked --workspace -- --skip fixture_test_
      # tidy's `clippy-fix` applies what clippy can fix but fails on nothing, so
      # a lint with no automatic fix reaches main unless this step fails on it.
      - run: mise run clippy

  # One job per optimization level: the e2e fixtures, then the stdlib, both
  # compiled at that level. An optimizer bug reachable from `core:*` shows at
  # some levels and not others, so `fail-fast: false` lets every level finish —
  # which ones break says where the bug is.
  test-level:
    name: Test (${{ matrix.level }})
    needs: [build-wado, build-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Coverage runs the stdlib tests as well, so a level that measures it
      # does not run them a second time. Coverage must not depend on -O, and
      # the two extremes holding the same baseline say so.
      matrix:
        level: [O0, O1, O2, O3, Os]
        include:
          - { level: O0, stdlib: test-stdlib-coverage }
          - { level: O1, stdlib: test-stdlib }
          - { level: O2, stdlib: test-stdlib }
          - { level: O3, stdlib: test-stdlib-coverage }
          - { level: Os, stdlib: test-stdlib }
    env:
      LEVEL: ${{ matrix.level }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache: false
          prebuilt: wado e2e

      # From the package, as `cargo test` runs it. The e2e test names are lower
      # case.
      - name: e2e "fixture_test_${LEVEL,,}"
        working-directory: wado-compiler/tests
        run: ../../target/debug/e2e "fixture_test_${LEVEL,,}"
      - run: mise run "${{ matrix.stdlib }}" "$LEVEL"

      # Tier 1 is an optimizer fold, so these run at every level like the stdlib.
      - run: mise run test-log-levels "$LEVEL"

  # Every Wado program the repository runs as a tool or a test, outside the
  # stdlib, Gale and benchmark/, which have jobs of their own. This job sets how
  # long CI takes, so work that fits elsewhere goes to a job that finishes early.
  test-wado:
    name: Test (packages)
    needs: build-wado
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache: false
          prebuilt: wado
      # Eddy's tools spawn `rg`. A child the `wado` host runs may execute only
      # programs in the system baseline, so it comes from apt, not mise.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: mise run test-wado --exclude 'benchmark/**'

  test-gale-o2:
    name: Test (Gale)
    needs: build-wado
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache: false
          prebuilt: wado

      - run: mise run test-gale-o2

  # benchmark/'s tests. Fuel does not depend on the host, so the `test "fuel"`
  # regions are held to `benchmark/fuel.json` exactly, at -O2. The publish dry
  # run rides here because this job finishes early.
  test-fuel:
    name: Test (benchmark)
    needs: build-wado
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache: false
          prebuilt: wado

      - run: mise run test-fuel
      - run: scripts/dev-bin.sh wado test -O2 --format tap benchmark
      - run: scripts/dev-bin.sh wado publish --dry-run

  # The sandbox's escape tests, on what no other job runs: Seatbelt, and the
  # seccomp filter's arm64 branch, whose architecture check and system call
  # table differ from x86_64's. See docs/wep-2026-10-21-core-process.md.
  test-sandbox:
    name: Test (sandbox, ${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Linux arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # rustup installs the toolchain rust-toolchain.toml names; no mise tool
      # is needed. Only main saves, as cargo-cache.yml does for Linux x86_64.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sandbox-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p wado-host --lib sandbox::tests
      # Seatbelt logs each operation it denies, and a child it kills leaves a
      # crash report; the test sees only the exit status.
      - name: Show what the sandbox denied
        if: failure() && runner.os == 'macOS'
        run: |
          log show --last 30m --style compact --predicate 'eventMessage CONTAINS "deny("' |
            grep -E 'Sandbox: (sh|cat|sandbox-exec|wado_host[^(]*)\(' | head -n 200 || true
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -type f \
            \( -name 'sh*' -o -name 'sandbox-exec*' -o -name 'cat*' -o -name 'wado_host*' \) 2>/dev/null |
            head -n 3 | while read -r report; do
              echo "== $report"
              head -c 8000 "$report"
              echo
            done

  # `wado-run-webgpu` is its own workspace, so no job above builds, lints or
  # tests it. The corpus checks ride here because this job finishes early.
  test-webgpu:
    name: Test (WebGPU, corpus)
    needs: build-wado
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache: false
          prebuilt: wado
      # Its own workspace, target/ and lockfile, which no other job builds. Only
      # main saves, as cargo-cache.yml does for the workspace's.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wado-run-webgpu
          shared-key: webgpu
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A runner has no GPU, and wgpu needs a driver to find any adapter at all.
      # mesa-vulkan-drivers supplies lavapipe, which answers in software.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Build and test the runner
        working-directory: wado-run-webgpu
        env:
          WADO: ${{ github.workspace }}/target/debug/wado
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - run: mise run check-wadopoet-vocabulary
      - parallel:
          - run: mise run check-rust-paths
          - run: mise run check-spec-examples
          - run: mise run check-grammar
          - run: mise run check-highlight
          - run: mise run test-web-glue

  test:
    name: Test
    if: always()
    needs: [changes, build-wado, build-e2e, test-core, test-wado, test-gale-o2, test-fuel, test-level, test-webgpu, test-sandbox]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    steps:
      # Every job named in `needs` must have succeeded, `changes` included, so
      # adding one there is the only edit needed. A matrix (`test-level`,
      # `test-sandbox`) counts as one job, successful only if every entry was.
      - name: Check all jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          # Docs-only change: the test jobs were skipped on purpose, so
          # report success and let the required "Test" check go green at once.
          if [ "$CHANGES_RESULT" = "success" ] && [ "$CODE" != "true" ]; then
            echo "Docs-only change: test jobs skipped, reporting success."
            exit 0
          fi
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) (\(.value.result))"' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "Did not succeed:"
            echo "$failed"
            exit 1
          fi
          echo "All CI checks passed"
