name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  integrity:
    name: Integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integrity checks
        run: make clippy-fix update-bundled update-golden-fixtures format

      - name: Check for uncommitted changes
        id: diff
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "clean=true" >> $GITHUB_OUTPUT
          else
            echo "clean=false" >> $GITHUB_OUTPUT
            echo "::error::Uncommitted changes detected. Run 'make on-task-done' locally and commit the changes."
            git diff --stat
            exit 1
          fi

      - name: Comment on PR with diff
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIFF_STAT=$(git diff --stat)
          gh pr comment ${{ github.event.pull_request.number }} --body "## Uncommitted changes detected

          Integrity checks produced the following changes:

          \`\`\`
          ${DIFF_STAT}
          \`\`\`

          Please run \`make on-task-done\` locally and commit the changes."

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Run tests
        run: cargo test --locked --all
