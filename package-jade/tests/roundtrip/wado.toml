# Jade as a consumer uses it: the generator a build dependency, and the
# library an ordinary one, so a program a test evaluates can call
# `schema_for` on the types `generate` writes.
[package]
namespace = "wado-lang"
name = "jade-roundtrip"
version = "0.0.0"

[build-dependencies]
"wado-lang:jade" = { path = "../.." }

[dependencies]
"wado-lang:jade" = { path = "../.." }
"wado-lang:wadopoet" = { path = "../../../package-wadopoet" }

[test]
# Kiln intermediates are not standalone source files.
exclude = ["build/**"]
