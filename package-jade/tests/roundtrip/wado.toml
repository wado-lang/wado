# Jade as a consumer uses it: a test here evaluates the types D generates
# with `schema_for` in scope, which a program evaluated from Jade's own tests
# cannot import.
[package]
name = "jade-roundtrip"
version = "0.0.0"

[dependencies]
"lib:jade" = { path = "../.." }
"lib:wadopoet" = { path = "../../../package-wadopoet" }
