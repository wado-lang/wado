[package]
name = "hello-packages"
version = "0.1.0"

[world]
"wasi:cli/command" = "src/main.wado"

[registries]
default = "oci://ghcr.io"

[dependencies]
"wado-lang:cm-catalog" = { version = "^0.1.0" }

# Imports a component fetched by `wado fetch` (absent in CI), so it is not part
# of the compile-test sweep.
[test]
exclude = ["src/main.wado"]
