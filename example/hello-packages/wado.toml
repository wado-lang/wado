[package]
name = "hello-packages"
version = "0.1.0"

[world]
"wasi:cli/command" = "src/main.wado"

[registries]
default = "oci://ghcr.io"

[dependencies]
"wado-lang:cm-catalog" = { version = "^0.1.0" }

# gale (the Kiln generator for Calc.g4) is consumed from the registry: the
# published `core:kiln/generator` world of `wado-lang:gale`. `src/main.wado`
# references it as `module: "wado-lang:gale"`, resolved against this entry.
[build-dependencies]
"wado-lang:gale" = { version = "^0.0.9" }

# Imports a component fetched by `wado fetch` (absent in CI), so it is not part
# of the compile-test sweep.
[test]
exclude = ["src/main.wado"]
