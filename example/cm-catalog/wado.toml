[package]
name = "cm-catalog-example"
version = "0.1.0"

[world]
"wasi:cli/command" = "src/main.wado"

# `ns:pkg` resolves to <host>/<prefix>/<ns>/<pkg> = ghcr.io/wado-lang/wado/cm-catalog.
[registries]
default = "oci://ghcr.io/wado-lang"

[dependencies]
"wado:cm-catalog" = { version = "^0.1.0" }

# Imports a component fetched by `wado update` (absent in CI), so it is not part
# of the compile-test sweep.
[test]
exclude = ["src/main.wado"]
