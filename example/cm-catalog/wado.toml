[package]
name = "cm-catalog-example"
version = "0.1.0"

[world]
"wasi:cli/command" = "src/main.wado"

# OCI registry: an open coordinate `ns:pkg` resolves to
# `<oci-host>/<prefix>/<ns>/<pkg>` — here ghcr.io/wado-lang/wado/cm-catalog.
[registries]
default = "oci://ghcr.io/wado-lang"

[dependencies]
"wado:cm-catalog" = { version = "^0.1.0" }
