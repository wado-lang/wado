[package]
name = "wado"
description = "The Wado language as a package: its grammar, and a parser built from it"
repository-directory = "package-wado"
lib = "src/lib.wado"
exports = ["assets/grammar/Wado.g4"]
# version / repository / namespace / license / authors inherited from [workspace.package]

[build-dependencies]
"wado-lang:gale" = { path = "../package-gale" }

[dependencies]
"wado-lang:gale" = { path = "../package-gale" }

[test]
# `build/` holds Kiln intermediates; not source.
exclude = ["build/**"]
