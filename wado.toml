[package]
name = "wado"
version = "0.1.0"

[test]
# Benchmarks need their own host directory preopened (see `mise.toml`'s
# `test-wado` task). The default `wado test` invocation uses `(".", ".")`,
# which would resolve fixture paths against the repo root and fail. Keep
# them out of the universal walk and let the dedicated `wado test --dir
# benchmark::. benchmark` invocation cover them.
exclude = ["benchmark/**"]
