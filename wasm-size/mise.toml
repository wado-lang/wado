# Mise configuration for Wasm Size Comparison
# https://mise.jdx.dev/
#
# Compares .wasm binary sizes across different languages
#
# Run `mise install` to install managed tools.
# Remaining manual steps:
# - Rust wasm target: rustup target add wasm32-wasip1
# - Moonbit: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

[settings]
lockfile = true

[tools]
zig = "latest"
# "github:WebAssembly/wasi-sdk" = "latest" # clang + wasm-ld + wasi-sysroot (disabled: GH rate limit)

[env]
OUT_DIR = "out"
WASMTIME = "wasmtime"

[tasks.build-c]
description = "Build C programs to Wasm"
run = """
#!/usr/bin/env bash
set -e
mkdir -p "$OUT_DIR"

# Find wasi-capable clang
# Priority: wasi-sdk (mise or manual) > system clang + wasi-sysroot > Homebrew
WASM_CLANG=""

# 1. wasi-sdk: clang with co-located wasi-sysroot
if command -v clang >/dev/null 2>&1; then
    SDK_DIR="$(cd "$(dirname "$(command -v clang)")/.." 2>/dev/null && pwd)"
    if [ -d "$SDK_DIR/share/wasi-sysroot" ]; then
        WASM_CLANG="clang --target=wasm32-wasi --sysroot=$SDK_DIR/share/wasi-sysroot"
    fi
fi

# 2. System clang + apt wasi-sysroot (Linux)
if [ -z "$WASM_CLANG" ] && command -v clang >/dev/null 2>&1 && command -v wasm-ld >/dev/null 2>&1 && [ -d "/usr/share/wasi-sysroot" ]; then
    WASM_CLANG="clang --target=wasm32-wasi --sysroot=/usr/share/wasi-sysroot"
fi

# 3. Homebrew (macOS)
if [ -z "$WASM_CLANG" ] && [ "$(uname)" = "Darwin" ]; then
    LLVM_PATH="/opt/homebrew/opt/llvm"
    LLD_PATH="/opt/homebrew/opt/lld"
    WASI_SYSROOT="/opt/homebrew/opt/wasi-libc/share/wasi-sysroot"
    WASI_RUNTIMES="/opt/homebrew/opt/wasi-runtimes/share/wasi-runtimes"
    if [ -x "$LLVM_PATH/bin/clang" ] && [ -x "$LLD_PATH/bin/wasm-ld" ] && [ -d "$WASI_SYSROOT" ] && [ -d "$WASI_RUNTIMES" ]; then
        WASM_CLANG="PATH=$LLD_PATH/bin:$PATH $LLVM_PATH/bin/clang --target=wasm32-wasi --sysroot=$WASI_SYSROOT -resource-dir $WASI_RUNTIMES"
    fi
fi

if [ -n "$WASM_CLANG" ]; then
    echo "Building C..."
    eval $WASM_CLANG -Oz -Wl,--strip-all -o "$OUT_DIR/hello_world_c.wasm" hello_world/hello_world.c
    eval $WASM_CLANG -Oz -Wl,--strip-all -o "$OUT_DIR/pi_approx_c.wasm" pi_approx/pi_approx.c
    eval $WASM_CLANG -Oz -Wl,--strip-all -Izlib/zlib-1.3.1 -o "$OUT_DIR/zlib_c.wasm" zlib/zlib.c zlib/zlib-1.3.1/adler32.c zlib/zlib-1.3.1/crc32.c zlib/zlib-1.3.1/inffast.c zlib/zlib-1.3.1/inflate.c zlib/zlib-1.3.1/inftrees.c zlib/zlib-1.3.1/zutil.c
else
    echo "SKIP: C (run 'mise install' for wasi-sdk)"
fi
"""

[tasks.build-rust]
description = "Build Rust programs to Wasm"
run = """
#!/usr/bin/env bash
set -e
mkdir -p "$OUT_DIR"

if rustup target list --installed 2>/dev/null | grep -q wasm32-wasip1; then
    echo "Building Rust..."
    (cd hello_world && cargo build --release --target wasm32-wasip1)
    (cd pi_approx && cargo build --release --target wasm32-wasip1)
    (cd zlib && cargo build --release --target wasm32-wasip1)
    cp hello_world/target/wasm32-wasip1/release/hello_world.wasm "$OUT_DIR/hello_world_rust.wasm"
    cp pi_approx/target/wasm32-wasip1/release/pi_approx.wasm "$OUT_DIR/pi_approx_rust.wasm"
    cp zlib/target/wasm32-wasip1/release/zlib_bench.wasm "$OUT_DIR/zlib_rust.wasm"

    # tree-sitter-sequel depends on a C parser: needs wasi-sdk (clang + wasi-sysroot).
    SDK_DIR=""
    if command -v clang >/dev/null 2>&1; then
        SDK_DIR="$(cd "$(dirname "$(command -v clang)")/.." 2>/dev/null && pwd)"
    fi
    if [ -n "$SDK_DIR" ] && [ -d "$SDK_DIR/share/wasi-sysroot" ]; then
        CC_wasm32_wasip1="$SDK_DIR/bin/clang" \
        CFLAGS_wasm32_wasip1="--sysroot=$SDK_DIR/share/wasi-sysroot" \
        AR_wasm32_wasip1="$SDK_DIR/bin/llvm-ar" \
            cargo build --release --target wasm32-wasip1 --manifest-path sqlite_highlight/Cargo.toml
        cp sqlite_highlight/target/wasm32-wasip1/release/sqlite_highlight.wasm "$OUT_DIR/sqlite_highlight_rust.wasm"
    else
        echo "SKIP: sqlite_highlight Rust (needs wasi-sdk for tree-sitter C parser)"
    fi
else
    echo "SKIP: Rust (rustup target add wasm32-wasip1)"
fi
"""

[tasks.build-zig]
description = "Build Zig programs to Wasm"
run = """
#!/usr/bin/env bash
set -e
mkdir -p "$OUT_DIR"

echo "Building Zig..."
zig build-exe -O ReleaseSmall -target wasm32-wasi hello_world/hello_world.zig -femit-bin="$OUT_DIR/hello_world_zig.wasm"
zig build-exe -O ReleaseSmall -target wasm32-wasi pi_approx/pi_approx.zig -femit-bin="$OUT_DIR/pi_approx_zig.wasm"
zig build-exe -O ReleaseSmall -target wasm32-wasi zlib/zlib.zig -femit-bin="$OUT_DIR/zlib_zig.wasm"
"""

[tasks.build-moonbit]
description = "Build Moonbit programs to Wasm"
run = """
#!/usr/bin/env bash
set -e
mkdir -p "$OUT_DIR"

export PATH="$HOME/.moon/bin:$PATH"

if command -v moon >/dev/null 2>&1; then
    echo "Building Moonbit..."
    (cd hello_world && moon build --target wasm --release --strip)
    (cd pi_approx && moon build --target wasm --release --strip)
    cp hello_world/_build/wasm/release/build/hello_world.wasm "$OUT_DIR/hello_world_moonbit.wasm"
    cp pi_approx/_build/wasm/release/build/pi_approx.wasm "$OUT_DIR/pi_approx_moonbit.wasm"
else
    echo "SKIP: Moonbit (curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash)"
fi
"""

[tasks.build-wado]
description = "Build Wado programs to Wasm"
run = """
#!/usr/bin/env bash
set -e
mkdir -p "$OUT_DIR"

echo "Building Wado..."
if [ -f hello_world/hello_world.wado ]; then
    cargo run --manifest-path ../wado-cli/Cargo.toml -- compile -Os -o "$OUT_DIR/hello_world_wado.wasm" hello_world/hello_world.wado
    cargo run --manifest-path ../wado-cli/Cargo.toml -- compile -Os -o "$OUT_DIR/pi_approx_wado.wasm" pi_approx/pi_approx.wado
    cargo run --manifest-path ../wado-cli/Cargo.toml -- compile -Os -o "$OUT_DIR/zlib_wado.wasm" zlib/zlib.wado
    cargo run --manifest-path ../wado-cli/Cargo.toml -- compile -Os -o "$OUT_DIR/sqlite_highlight_wado.wasm" sqlite_highlight/sqlite_highlight.wado
else
    echo "SKIP: Wado (source files not found)"
fi
"""

[tasks.gen-test-data]
description = "Generate test data for zlib and sqlite_highlight benchmarks"
run = """
#!/usr/bin/env bash
set -e
mkdir -p "$OUT_DIR"
gzip -c README.md > "$OUT_DIR/test.gz"
echo "Generated $OUT_DIR/test.gz from README.md ($(wc -c < README.md | tr -d ' ') -> $(wc -c < "$OUT_DIR/test.gz" | tr -d ' ') bytes)"

# Minimal SQL sample for sqlite_highlight validation.
cat > "$OUT_DIR/sample.sql" <<'SQL'
-- sample SQL for syntax highlighting
SELECT id, name FROM users WHERE active = 1 ORDER BY id DESC LIMIT 10;
SQL
echo "Generated $OUT_DIR/sample.sql"
"""

[tasks.build-all]
description = "Build all language targets"
depends = ["gen-test-data", "build-rust", "build-zig", "build-moonbit", "build-c", "build-wado"]

[tasks.validate]
description = "Validate built Wasm files with wasmtime"
run = """
#!/usr/bin/env bash
WADO_CLI="cargo run --quiet --manifest-path ../wado-cli/Cargo.toml --"
FAIL=0

echo ""
echo "=== Validation (running with wasmtime) ==="
# WASI Preview 1 programs (non-zlib)
for f in "$OUT_DIR"/hello_world_*.wasm "$OUT_DIR"/pi_approx_*.wasm; do
    if [ -f "$f" ] && [[ "$f" != *_wado.wasm ]]; then
        printf "%-40s " "$f:"
        $WASMTIME "$f" 2>&1 | head -1 || echo "(failed)"
    fi
done
# Wado non-zlib programs (run from source via wado CLI)
for src in hello_world/hello_world.wado pi_approx/pi_approx.wado; do
    if [ -f "$src" ]; then
        printf "%-40s " "$src:"
        $WADO_CLI run "$src" 2>/dev/null | head -1 || echo "(failed)"
    fi
done

# zlib: decompress README.md.gz and diff against original
echo ""
echo "=== zlib Verification (decompress README.md.gz, diff against original) ==="
for f in "$OUT_DIR"/zlib_*.wasm; do
    if [ ! -f "$f" ]; then continue; fi
    lang=$(basename "$f" .wasm | sed 's/zlib_//')
    printf "%-12s " "$lang:"

    # Run decompressor
    if [[ "$f" == *_wado.wasm ]]; then
        $WADO_CLI run zlib/zlib.wado < "$OUT_DIR/test.gz" > "$OUT_DIR/zlib_${lang}_out.bin" 2>/dev/null
    else
        $WASMTIME "$f" < "$OUT_DIR/test.gz" > "$OUT_DIR/zlib_${lang}_out.bin" 2>/dev/null
    fi

    # Diff against original
    if diff -q README.md "$OUT_DIR/zlib_${lang}_out.bin" >/dev/null 2>&1; then
        echo "OK (matches README.md)"
    else
        echo "FAIL (output differs from README.md)"
        diff README.md "$OUT_DIR/zlib_${lang}_out.bin" | head -5
        FAIL=1
    fi
done

if [ "$FAIL" -ne 0 ]; then
    echo ""
    echo "ERROR: Some zlib programs produced incorrect output"
    exit 1
fi

# sqlite_highlight: feed a small SQL sample and verify non-empty HTML output.
echo ""
echo "=== sqlite_highlight Verification (produce HTML from sample.sql) ==="
for f in "$OUT_DIR"/sqlite_highlight_*.wasm; do
    if [ ! -f "$f" ]; then continue; fi
    lang=$(basename "$f" .wasm | sed 's/sqlite_highlight_//')
    printf "%-12s " "$lang:"

    if [[ "$f" == *_wado.wasm ]]; then
        $WADO_CLI run sqlite_highlight/sqlite_highlight.wado < "$OUT_DIR/sample.sql" > "$OUT_DIR/sqlite_highlight_${lang}_out.html" 2>/dev/null
    else
        $WASMTIME "$f" < "$OUT_DIR/sample.sql" > "$OUT_DIR/sqlite_highlight_${lang}_out.html" 2>/dev/null
    fi

    if [ -s "$OUT_DIR/sqlite_highlight_${lang}_out.html" ]; then
        echo "OK ($(wc -c < "$OUT_DIR/sqlite_highlight_${lang}_out.html" | tr -d ' ') bytes HTML)"
    else
        echo "FAIL (no output)"
        FAIL=1
    fi
done

if [ "$FAIL" -ne 0 ]; then
    echo ""
    echo "ERROR: Some sqlite_highlight programs produced incorrect output"
    exit 1
fi
"""

[tasks.report-wasm-size]
description = "Build all and report Wasm sizes"
depends = ["build-all", "validate"]
run = """
#!/usr/bin/env bash
PROGRAMS="hello_world pi_approx zlib sqlite_highlight"

echo ""
echo "=== Wasm Size Report ==="
echo ""
echo "| Program          | Language       | Size (bytes) |"
echo "|------------------|----------------|--------------|"
for prog in $PROGRAMS; do
    for f in "$OUT_DIR"/${prog}_*.wasm; do
        if [ -f "$f" ]; then
            lang=$(basename "$f" .wasm | sed "s/${prog}_//")
            size=$(wc -c < "$f" | tr -d ' ')
            printf "%s\t%s\t%s\n" "$size" "$prog" "$lang"
        fi
    done | sort -n | while IFS=$'\t' read -r size prog lang; do
        printf "| %-16s | %-14s | %12s |\n" "$prog" "$lang" "$size"
    done
done
echo ""
"""

[tasks.clean]
description = "Clean build artifacts"
run = """
#!/usr/bin/env bash
rm -rf "$OUT_DIR"
rm -rf hello_world/target pi_approx/target zlib/target sqlite_highlight/target
rm -rf hello_world/_build pi_approx/_build
"""

[tasks.install-deps]
description = "Show dependency installation instructions"
run = """
#!/usr/bin/env bash
echo "Managed by mise (run 'mise install'):"
echo "  zig, wasi-sdk (wasmtime is inherited from root mise.toml)"
echo ""
echo "Manual installation required:"
echo "  rustup target add wasm32-wasip1                                # Rust wasm target"
echo "  curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash  # Moonbit"
"""
