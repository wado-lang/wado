# Mise configuration for Wado benchmarks
# https://mise.jdx.dev/
#
# Run `mise install` to install managed tools.
# C compiler (cc) is expected from the system for native C benchmarks.
#
# Optional: wasi-sdk (clang + wasi-sysroot) for the C zlib Wasm benchmark.
# The mise-managed entry is currently commented out below to avoid
# GitHub API rate-limit failures during artifact install on shared CI
# runners. To enable C Wasm zlib measurements, either:
#   * Uncomment the `wasi-sdk` line in `[tools]` and re-run `mise install`
#     (works when GH artifact attestations are reachable), or
#   * Install via apt (Ubuntu/Debian):
#       apt install wasi-libc libclang-rt-18-dev-wasm32
# The zlib task skips the C Wasm step gracefully if neither is available.

[settings]
lockfile = true

[tools]
node = "latest"
bun = "latest"
# "github:WebAssembly/wasi-sdk" = "latest" # clang + wasm-ld + wasi-sysroot for C zlib Wasm (disabled: GH rate limit)

[tasks.count-prime]
description = "Run count_prime benchmark (integer arithmetic)"
run = """
#!/usr/bin/env bash
set -e

echo "=== Compiling Wado benchmark ==="
cargo run --release --manifest-path ../wado-cli/Cargo.toml --quiet -- compile -O2 -o count_prime/count_prime.wasm count_prime/count_prime.wado

echo "=== Compiling C benchmark ==="
cc -O3 -o count_prime/count_prime_c count_prime/count_prime.c

echo "=== C ==="
./count_prime/count_prime_c

echo "=== JavaScript ==="
node count_prime/count_prime.js

echo "=== Wado ==="
cargo run --release --manifest-path ../wado-cli/Cargo.toml --quiet -- run -O2 count_prime/count_prime.wado
"""

