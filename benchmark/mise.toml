# Mise configuration for Wado benchmarks
# https://mise.jdx.dev/
#
# Run `mise install` to install managed tools.
# C compiler (cc) is expected from the system.

[tools]
node = "latest"
python = "latest"
ruby = "latest"

[tasks.count-prime]
description = "Run count_prime benchmark (integer arithmetic)"
run = """
#!/usr/bin/env bash
set -e

echo "=== Compiling Wado benchmark ==="
cargo run --manifest-path ../wado-cli/Cargo.toml --quiet -- compile -O2 -o count_prime/count_prime.wasm count_prime/count_prime.wado

echo "=== Compiling C benchmark ==="
cc -O3 -o count_prime/count_prime_c count_prime/count_prime.c

echo "=== C ==="
./count_prime/count_prime_c

echo "=== JavaScript ==="
node count_prime/count_prime.js

echo "=== Python ==="
python3 count_prime/count_prime.py

echo "=== Ruby ==="
ruby count_prime/count_prime.rb

echo "=== Wado ==="
cargo run --manifest-path ../wado-cli/Cargo.toml --quiet -- run -O2 count_prime/count_prime.wado
"""

[tasks.mandelbrot]
description = "Run mandelbrot benchmark (float arithmetic)"
run = """
#!/usr/bin/env bash
set -e

echo "=== Compiling Wado benchmark ==="
cargo run --manifest-path ../wado-cli/Cargo.toml --quiet -- compile -O2 -o mandelbrot/mandelbrot.wasm mandelbrot/mandelbrot.wado

echo "=== Compiling C benchmark ==="
cc -O3 -ffp-contract=off -o mandelbrot/mandelbrot_c mandelbrot/mandelbrot.c

echo "=== C ==="
./mandelbrot/mandelbrot_c

echo "=== JavaScript ==="
node mandelbrot/mandelbrot.js

echo "=== Python ==="
python3 mandelbrot/mandelbrot.py

echo "=== Ruby ==="
ruby mandelbrot/mandelbrot.rb

echo "=== Wado ==="
cargo run --manifest-path ../wado-cli/Cargo.toml --quiet -- run -O2 mandelbrot/mandelbrot.wado
"""

[tasks.sieve]
description = "Run sieve benchmark (array operations)"
run = """
#!/usr/bin/env bash
set -e

echo "=== Compiling Wado benchmark ==="
cargo run --manifest-path ../wado-cli/Cargo.toml --quiet -- compile -O2 -o sieve/sieve.wasm sieve/sieve.wado

echo "=== Compiling C benchmark ==="
cc -O3 -o sieve/sieve_c sieve/sieve.c

echo "=== C ==="
./sieve/sieve_c

echo "=== JavaScript ==="
node sieve/sieve.js

echo "=== Python ==="
python3 sieve/sieve.py

echo "=== Ruby ==="
ruby sieve/sieve.rb

echo "=== Wado ==="
cargo run --manifest-path ../wado-cli/Cargo.toml --quiet -- run -O2 sieve/sieve.wado
"""

[tasks.zlib]
description = "Run zlib benchmark (compression)"
run = """
#!/usr/bin/env bash
set -e

echo "=== Compiling zlib-rs benchmark ==="
cargo build --release --manifest-path zlib/Cargo.toml --quiet

echo "=== zlib-rs (native Rust) ==="
./zlib/target/release/zlib_rs_bench

echo "=== Wado ==="
cargo run --manifest-path ../wado-cli/Cargo.toml --quiet -- run -O2 zlib/zlib_bench.wado
"""

[tasks.clean]
description = "Clean benchmark artifacts"
run = """
rm -f count_prime/*.wasm mandelbrot/*.wasm sieve/*.wasm
rm -f count_prime/count_prime_c mandelbrot/mandelbrot_c sieve/sieve_c
rm -rf zlib/target
"""
