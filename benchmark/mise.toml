"""

[tasks.json-catalog]
description = "Run json-catalog benchmark (JSON deserialization)"
run = """
#!/usr/bin/env bash
set -e

echo "=== Compiling Rust serde_json benchmark ==="
cargo build --release --manifest-path json_catalog/Cargo.toml --quiet

echo "=== Rust serde_json ==="
./json_catalog/target/release/json_catalog_bench

echo "=== Wado ==="
cargo run --release --manifest-path ../wado-cli/Cargo.toml --quiet -- run -O2 json_catalog/json_catalog.wado
"""

[tasks.all]
description = "Run all benchmarks serially"
run = """
#!/usr/bin/env bash
set -e
MISE_JOBS=1 mise run count-prime
MISE_JOBS=1 mise run mandelbrot
MISE_JOBS=1 mise run sieve
MISE_JOBS=1 mise run zlib
MISE_JOBS=1 mise run fts
MISE_JOBS=1 mise run json-twitter
MISE_JOBS=1 mise run json-canada
MISE_JOBS=1 mise run json-catalog
"""

[tasks.clean]
description = "Clean benchmark artifacts"
run = """
rm -f count_prime/*.wasm mandelbrot/*.wasm sieve/*.wasm
rm -f count_prime/count_prime_c mandelbrot/mandelbrot_c sieve/sieve_c
rm -f fts/fts_c fts/fts_rs fts/fts_zig fts/fts_zig.o
rm -rf zlib/target json_twitter/target json_canada/target json_catalog/target
"""
