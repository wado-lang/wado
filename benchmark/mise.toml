[tasks.http-routing]
description = "Run HTTP routing benchmark (wado serve vs Hono on Node.js and Bun vs Axum)"
run = "./http_routing/bench.sh"

[tasks.all]
description = "Run all benchmarks serially"
run = """
#!/usr/bin/env bash
set -e
MISE_JOBS=1 mise run count-prime
MISE_JOBS=1 mise run mandelbrot
MISE_JOBS=1 mise run sieve
MISE_JOBS=1 mise run zlib
MISE_JOBS=1 mise run fts
MISE_JOBS=1 mise run json-twitter
MISE_JOBS=1 mise run json-canada
MISE_JOBS=1 mise run json-catalog
MISE_JOBS=1 mise run sqlite-parse
MISE_JOBS=1 mise run syntax-highlight
"""

[tasks.clean]
description = "Clean benchmark artifacts"
run = """
rm -f count_prime/*.wasm mandelbrot/*.wasm sieve/*.wasm zlib/zlib_c.wasm
rm -f count_prime/count_prime_c mandelbrot/mandelbrot_c sieve/sieve_c
rm -f fts/fts_c fts/fts_rs
rm -rf zlib/target json_twitter/target json_canada/target json_catalog/target syntax_highlight/target
rm -rf syntax_highlight/node_modules syntax_highlight/package-lock.json
rm -rf http_routing/node_modules http_routing/package-lock.json http_routing/target
"""
