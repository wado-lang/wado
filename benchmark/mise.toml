# Mise configuration for Wado benchmarks
# https://mise.jdx.dev/
#
# Run `mise install` to install managed tools.
# C compiler (cc) is expected from the system.

[tools]
node = "latest"
zig = "latest"

[tasks.count-prime]
description = "Run count_prime benchmark (integer arithmetic)"
run = """
#!/usr/bin/env bash
set -e

echo "=== Compiling Wado benchmark ==="
cargo run --release --manifest-path ../wado-cli/Cargo.toml --quiet -- compile -O2 -o count_prime/count_prime.wasm count_prime/count_prime.wado

echo "=== Compiling C benchmark ==="
cc -O3 -o count_prime/count_prime_c count_prime/count_prime.c

echo "=== C ==="
./count_prime/count_prime_c

echo "=== JavaScript ==="
node count_prime/count_prime.js

echo "=== Wado ==="
cargo run --release --manifest-path ../wado-cli/Cargo.toml --quiet -- run -O2 count_prime/count_prime.wado
"""

[tasks.mandelbrot]
description = "Run mandelbrot benchmark (float arithmetic)"
run = """
#!/usr/bin/env bash
set -e

echo "=== Compiling Wado benchmark ==="
cargo run --release --manifest-path ../wado-cli/Cargo.toml --quiet -- compile -O2 -o mandelbrot/mandelbrot.wasm mandelbrot/mandelbrot.wado

echo "=== Compiling C benchmark ==="
cc -O3 -ffp-contract=off -o mandelbrot/mandelbrot_c mandelbrot/mandelbrot.c

echo "=== C ==="
./mandelbrot/mandelbrot_c

echo "=== JavaScript ==="
node mandelbrot/mandelbrot.js

echo "=== Wado ==="
cargo run --release --manifest-path ../wado-cli/Cargo.toml --quiet -- run -O2 mandelbrot/mandelbrot.wado
"""

[tasks.sieve]
description = "Run sieve benchmark (array operations)"
run = """
#!/usr/bin/env bash
set -e

echo "=== Compiling Wado benchmark ==="
cargo run --release --manifest-path ../wado-cli/Cargo.toml --quiet -- compile -O2 -o sieve/sieve.wasm sieve/sieve.wado

echo "=== Compiling C benchmark ==="
cc -O3 -o sieve/sieve_c sieve/sieve.c

echo "=== C ==="
./sieve/sieve_c

echo "=== JavaScript ==="
node sieve/sieve.js

echo "=== Wado ==="
cargo run --release --manifest-path ../wado-cli/Cargo.toml --quiet -- run -O2 sieve/sieve.wado
"""

[tasks.zlib]
description = "Run zlib benchmark (compression)"
run = """
#!/usr/bin/env bash
set -e

echo "=== Compiling zlib-rs benchmark ==="
cargo build --release --manifest-path zlib/Cargo.toml --quiet

echo "=== zlib-rs (native Rust) ==="
./zlib/target/release/zlib_rs_bench

echo "=== Wado ==="
cargo run --release --manifest-path ../wado-cli/Cargo.toml --quiet -- run -O2 zlib/zlib_bench.wado
"""

[tasks.fts]
description = "Run fts benchmark (float-to-string conversion)"
run = """
#!/usr/bin/env bash
set -e

echo "=== Compiling C benchmark ==="
cc -O3 -o fts/fts_c fts/fts.c

echo "=== Compiling Rust benchmark ==="
rustc -O -o fts/fts_rs fts/fts.rs

echo "=== Compiling Zig benchmark ==="
zig build-exe fts/fts.zig -OReleaseFast --name fts_zig 2>/dev/null
mv fts_zig fts/fts_zig
rm -f fts_zig.o

echo "=== C ==="
./fts/fts_c

echo "=== Rust ==="
./fts/fts_rs

echo "=== Zig ==="
./fts/fts_zig

echo "=== Wado ==="
cargo run --release --manifest-path ../wado-cli/Cargo.toml --quiet -- run -O2 fts/fts.wado
"""

[tasks.json-twitter]
description = "Run json-twitter benchmark (JSON deserialization)"
run = """
#!/usr/bin/env bash
set -e

echo "=== Compiling Rust serde_json benchmark ==="
cargo build --release --manifest-path json_twitter/Cargo.toml --quiet

echo "=== Rust serde_json ==="
./json_twitter/target/release/json_twitter_bench

echo "=== Wado ==="
cargo run --release --manifest-path ../wado-cli/Cargo.toml --quiet -- run -O2 json_twitter/json_twitter.wado
"""

[tasks.json-canada]
description = "Run json-canada benchmark (JSON deserialization)"
run = """
#!/usr/bin/env bash
set -e

echo "=== Compiling Rust serde_json benchmark ==="
cargo build --release --manifest-path json_canada/Cargo.toml --quiet

echo "=== Rust serde_json ==="
./json_canada/target/release/json_canada_bench

echo "=== Wado ==="
