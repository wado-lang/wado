[package]
name = "gale"
description = "A Wado-native parser generator compatible with ANTLR4 .g4 grammars"
repository-directory = "package-gale"
lib = "src/lib.wado"
# version / repository / namespace / license / authors inherited from [workspace.package]

[world]
"wasi:cli/command" = "src/main.wado"
"core:kiln/generator" = "src/generator.wado"

[format]
# The descriptor corpus is written by `scripts/extract_antlr4_descriptors.wado`,
# so the extractor decides its layout. Formatting it makes `mise run format` and
# a regeneration each undo the other, and the committed corpus drifts from the
# generator that is supposed to reproduce it byte for byte. (`tests/generated/`
# is Kiln output and happens to be formatter-stable, so it stays in.)
exclude = ["tests/antlr4-compat/**"]

[test]
# Kiln intermediates are not standalone source files. Keep this exclusion
# when the package is used outside the repository's `.gitignore` coverage.
exclude = ["build/**"]
