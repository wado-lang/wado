[package]
name = "kiln-consumer"
version = "0.1.0"
command = "src/main.wado"

# Reference Gale's generator module directly by path. The driver's
# `lower()` accepts `module = { path = "..." }` and routes it to
# `GeneratorModule::LocalPath`. `from` points at the primary grammar file,
# and `output_dir` lands the generated parser alongside user source.
[build.generators.parser]
module = { path = "../../src/generator.wado" }
from = "grammar.g4"
output-dir = "src/generated"
options = { highlight = false }
