# IfIfElseNonGreedyBinding1's parse-accepts-input claim (b) is met
# today — the input parses to Ok regardless of where the parser binds
# the `else`. The wrong-binding behaviour is a tree-shape concern,
# tracked under [stage_b_oracle_todo] below.
#
# The SemPredEvalLexer entries below are showDFA descriptors: the
# extractor drops ANTLR's DFA dump from the expected (it describes
# ANTLR's simulator, not the token stream), leaving a plain token dump
# that diverges for one reason only — the lexer predicate is dropped.
# They flip together when java2wado covers lexer bodies.
"SemPredEvalLexer/IDvsEnum" = "lexer semantic predicates are dropped on the Java action path, so the predicate-disabled ENUM still wins the tournament and enum lexes as ENUM instead of ID"
"SemPredEvalLexer/IDnotEnum" = "lexer semantic predicates are dropped on the Java action path — same root cause as IDvsEnum"
"SemPredEvalLexer/EnumNotID" = "lexer semantic predicates are dropped on the Java action path, so ENUM wins for every lowercase run instead of only for enum"
"SemPredEvalLexer/DisableRule" = "lexer semantic predicates are dropped on the Java action path, so E1 wins over E2 instead of being disabled"

