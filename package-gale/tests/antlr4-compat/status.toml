# Triage state for ANTLR4 runtime-testsuite descriptors.
#
# Each entry's key is "<Category>/<Name>" (no .txt suffix). Sections:
#
#   [todo] — Stage A: descriptor parses cleanly with `antlr4` but Gale
#            rejects it. The generated test gets `#[TODO]` so the failure
#            is recorded without blocking CI. Drop the entry once the
#            underlying gap is closed.
#   [skip] — Stage A: descriptor will not be emitted as a Wado test at
#            all (use for genuinely target-language-specific tests,
#            never for things we just haven't fixed yet).
#
#   [stage_a_todo] — Stage A: the generated parser fails to accept the
#            descriptor's [input]. The test is emitted with `#[TODO]` so
#            it is recorded as expected-to-fail. Drop once the gap is
#            closed (typically LL prediction, codegen, or a [start] /
#            first-parser-rule mismatch the test wasn't written to
#            tolerate).
#   [stage_a_skip] — Stage A: emission is skipped entirely. Use when
#            the grammar cannot be compiled by Gale or running through
#            it would be meaningless (e.g. [start] rule differs from
#            Gale's `parse()` entry by design).
#
#   [stage_b_todo] — Stage B: tree-shape comparison fails at runtime;
#            the test is emitted with `#[TODO]` so it is recorded as
#            expected-to-fail. Drop once the underlying divergence is
#            fixed (Gale codegen, LR rewriting, or action handling).
#   [stage_b_skip] — Stage B: emission is skipped entirely. Use when
#            the test cannot even compile (e.g. Gale codegen produces
#            invalid Wado for the descriptor's grammar) so a `#[TODO]`
#            marker has nothing to attach to.
#
#   [stage_e_todo] — Stage E: the parse-must-error test fails at
#            runtime (the generated parser/lexer did NOT report an
#            error for [input]). Eligible categories are ParserErrors
#            and LexerErrors. Drop once the gap is closed.
#   [stage_e_skip] — Stage E: emission is skipped entirely. Use when
#            Gale codegen produces invalid Wado for the descriptor's
#            grammar so a `#[TODO]` marker has nothing to attach to.
#
#   [stage_l_todo] — Stage L: token-stream equivalence fails (the
#            ANTLR4-format dump of `tokenize(&input)` does not match
#            `[output]`). Eligible categories are lexer-type descriptors.
#   [stage_l_skip] — Stage L: emission is skipped entirely.
#
# The free-form value is a one-line reason that flows into the generated
# test as a comment. The reason text is written verbatim — keep it free
# of backslashes (the parser does not unescape) and double quotes.
#
# After editing this file, re-run:
#   package-gale/scripts/extract-antlr4-descriptors.sh

