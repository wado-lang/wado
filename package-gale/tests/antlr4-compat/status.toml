"Sets/UnicodeEscapedSMPRangeSet" = "oracle: TestRig encodes non-ASCII as `?`; Gale renders the actual SMP code points (`😉 🥂 🜀`). Same root cause as UnicodeEscapedBMPRangeSet."
"Sets/UnicodeEscapedSMPSet" = "oracle: TestRig encodes non-ASCII as `?`; Gale renders `𝗂𝗎𝖺`. Same root cause as UnicodeEscapedBMPRangeSet."
"Sets/UnicodeNegatedBMPSetIncludesSMPCodePoints" = "oracle: TestRig encodes non-ASCII as `?`; Gale renders `😳😡😝🤓`. Same root cause as UnicodeEscapedBMPRangeSet."
