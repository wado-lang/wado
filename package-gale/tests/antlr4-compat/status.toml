"LexerExec/ZeroLengthToken" = "tokens-equivalence: Gale lexer does not merge the `-> more, pushMode(...)` and `-> more, mode(...)` chain into a single token across mode transitions (Stage C-independent)"
"LexerExec/ReservedWordsEscaping" = "tokens-equivalence: expected output includes a `channel=N` token but Gale's lexer codegen routes non-default-channel tokens to `Token.leading_trivia` rather than the main stream, so `to_lexer_string` does not emit them. Gap: either land non-default-channel tokens in the main stream with a channel attribute (have the parser filter), or extend `to_lexer_string` to walk trivia in source order."
"ParserExec/IfIfElseNonGreedyBinding1" = "parse-accepts-input: emit shape for `(elem)??` now matches the Option<T> CST decl (so the test compiles), but the parser still applies greedy `(elem)?` prediction. ANTLR4's `??` prefers not-matching when the lookahead is ambiguous; the descriptor's expected parse tree binds the `else` to the outer if. Implementing prefer-skip prediction requires either a follow-set guard on the Optional dispatch or a runtime ATN simulator (TODO.md)."

