[stage_b_oracle_todo]
"ParserExec/IfIfElseNonGreedyBinding2" = "Empty-alt group `( | 'else' statement)`, not a `??` repeat — a greedy multi-alt block decision. The runtime ATN simulator now handles non-greedy `??` (Binding1 is green), but the greedy multi-alt / Ambiguous-group decision site is not yet wired to the simulator, so this still binds the `else` to the inner ifStatement. Flips when the ATN is wired at the multi-alt group dispatch (TODO.md P3b follow-up)."
"SemPredEvalParser/ToLeftWithVaryingPredicate" = "Stage C: semantic predicate evaluation drives alt selection at runtime in ANTLR4. Gale's generator skips action bodies entirely (including `{...}?` predicates), so it picks the first alt unconditionally and produces an empty `(s)` shell instead of the oracle's predicate-guided `(s (a x) (a x) (a y))`. Untriaged until Stage C lands."
"Sets/CharSetLiteral" = "Lexer or grammar shape mismatch — Gale produces `(a)` while the oracle produces `(a A a B b)`. Likely a Gale-side parser bug (rule fails to repeat or EOF is consumed too early). Worth a TDD investigation as a self-contained ATN-class case."
"ParserErrors/LL1ErrorInfo" = "Error recovery: ANTLR4's recovered tree pulls `acClass` up as a bare token (single-token insertion), while Gale produces a proper empty-rule `(acClass)` node. Error-recovery shape differences are the same gap as `ParseTrees/ExtraToken` / `NoViableAlt` / `Sync`; flip together when error recovery lands."
