# Triage state for ANTLR4 runtime-testsuite descriptors.
#
# Each entry's key is "<Category>/<Name>" (no .txt suffix). Sections:
#
#   [todo] — Stage A claim (a): descriptor parses cleanly with `antlr4`
#            but Gale rejects it. The generated test gets `#[TODO]` so
#            the failure is recorded without blocking CI. Drop the entry
#            once the underlying gap is closed.
#   [skip] — Stage A claim (a): descriptor will not be emitted as a Wado
#            test at all (use for genuinely target-language-specific
#            tests, never for things we just haven't fixed yet). A
#            category-level skip also suppresses per-descriptor Stage A
#            (b/c/d) and Stage B emission.
#
#   [stage_a_todo] — Stage A claims (b/c/d): the per-descriptor driver
#            (whichever of parse-accepts-input / parse-must-error /
#            tokens-equivalence variants fires for the descriptor) does
#            not pass. The test file is emitted with `#[TODO]` so the
#            gap is recorded as expected-to-fail. The three variants are
#            mutually exclusive on `[type]` + `[errors]`, so a single
#            entry keyed by `Category/Name` unambiguously targets the
#            right test. Drop once the gap is closed.
#   [stage_a_skip] — Stage A claims (b/c/d): emission of the
#            per-descriptor driver is skipped entirely. Reserved for
#            compile-blocking codegen bugs (Gale produces invalid Wado
#            for the grammar, so no test file would build). Runtime
#            gaps go to `[stage_a_todo]` so the failing test stays
#            visible in CI.
#
#   [stage_b_todo] — Stage B: tree-shape comparison fails at runtime
#            (full-tree or sub-tree variant); the test is emitted with
#            `#[TODO]` so it is recorded as expected-to-fail. Drop once
#            the underlying divergence is fixed (Gale codegen, LR
#            rewriting, or action handling).
#   [stage_b_skip] — Stage B: emission is skipped entirely. Use when
#            the test cannot even compile (e.g. Gale codegen produces
#            invalid Wado for the descriptor's grammar) so a `#[TODO]`
#            marker has nothing to attach to.
#
# The free-form value is a one-line reason that flows into the generated
# test as a comment. The reason text is written verbatim — keep it free
# of backslashes (the parser does not unescape) and double quotes.
#
# After editing this file, re-run:
#   package-gale/scripts/extract-antlr4-descriptors.sh

