[package]
name = "loam"
description = "Loam — tensor compilation for Wado: shapes checked at build time"
repository-directory = "package-loam"
lib = "src/lib.wado"
# The compiler's stages, for a consumer that drives them itself: the
# conformance oracle reads ONNX and infers shapes through them.
exports = [
    "example/webgpu/compare.wado",
    "src/emit.wado",
    "src/graph.wado",
    "src/infer.wado",
    "src/onnx_proto.wado",
    "src/onnx_text.wado",
    "src/runtime/graph_cases.wado",
    "src/safetensors.wado",
]
# version / repository / namespace / license / authors inherited from [workspace.package]

[world]
"wasi:cli/command" = "src/main.wado"
"core:kiln/generator" = "src/generator.wado"

[build-dependencies]
"lib:gale" = { path = "../package-gale", package = "wado-lang:gale", version = "^0.0.28" }
"lib:grog" = { path = "../package-grog", package = "wado-lang:grog", version = "^0.0.28" }

[dependencies]
"lib:grog" = { path = "../package-grog", package = "wado-lang:grog", version = "^0.0.28" }
"lib:wadopoet" = { path = "../package-wadopoet", package = "wado-lang:wadopoet", version = "^0.0.28" }

[test]
# Kiln intermediates are not standalone source files. Keep the exclusion when
# the package is used outside the repository's `.gitignore` coverage.
exclude = ["build/**"]
