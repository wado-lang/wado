# Loam as a consumer uses it: the generator a build dependency, its runtime an
# ordinary one, under the same name. The oracle also reads ONNX through the
# stages Loam exports.
[package]
name = "loam-conformance"
version = "0.0.0"

[build-dependencies]
"lib:loam" = { path = "../.." }

[dependencies]
"lib:loam" = { path = "../.." }

[test]
# `large/` reads a checkpoint its own writer puts in `build/`, which the
# runners' tests run first.
exclude = ["build/**", "large/**"]
