# Benchmarks Loam as a consumer runs it, like `example/`: not a workspace
# member, since nothing publishes it.
[package]
name = "loam-benchmark"
version = "0.0.0"

[build-dependencies]
"lib:loam" = { path = "..", package = "wado-lang:loam", version = "^0.0.28" }

[dependencies]
"lib:loam" = { path = "..", package = "wado-lang:loam", version = "^0.0.28" }

[test]
# GPT-2's checkpoint is too large to commit, and the build reads its header, so
# its files compile only once `example/gpt2-124m/fetch.sh` has run.
exclude = ["build/**", "gpt2_124m/**"]
