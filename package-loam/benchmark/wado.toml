# Benchmarks Loam as a consumer runs it, like `example/`: not a workspace
# member, since nothing publishes it.
[package]
name = "loam-benchmark"
version = "0.0.0"

[build-dependencies]
"lib:loam" = { path = "..", package = "wado-lang:loam", version = "^0.0.28" }

[dependencies]
"lib:loam" = { path = "..", package = "wado-lang:loam", version = "^0.0.28" }

[test]
# The checkpoints are too large to commit, and the build reads their headers, so
# each model's files compile only once its example's `fetch.sh` has run.
exclude = ["build/**", "gpt2_124m/**", "gemma3_270m/**"]
