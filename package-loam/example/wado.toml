# Loam as a consumer uses it: the generator a build dependency, its runtime an
# ordinary one, under the same name.
[package]
name = "loam-example"
version = "0.0.0"

[build-dependencies]
"lib:loam" = { path = "..", package = "wado-lang:loam", version = "^0.0.28" }

[dependencies]
"lib:loam" = { path = "..", package = "wado-lang:loam", version = "^0.0.28" }

[test]
# Gemma's tokenizer and checkpoint are too large to commit; `fetch.sh` puts them
# in its `build/`. Name its test files to run them.
exclude = ["build/**", "gpt2-124m/build/**", "gemma3-270m/**"]
