# Loam as a consumer uses it: the generator a build dependency, its runtime an
# ordinary one, under the same name.
[package]
name = "loam-example"
version = "0.0.0"

[build-dependencies]
"lib:loam" = { path = "..", package = "wado-lang:loam", version = "^0.0.28" }

[dependencies]
"lib:loam" = { path = "..", package = "wado-lang:loam", version = "^0.0.28" }

[test]
# Building GPT-2 or Gemma downloads the model, and running one reads the weights
# its `fetch.sh` downloads. Name a test file to run it. GPT-2's tokenizer is
# committed, so its test needs neither.
exclude = [
    "build/**",
    "gpt2-124m/generate_test.wado",
    "gpt2-124m/gpt2.wado",
    "gpt2-124m/model.wado",
    "gpt2-124m/webgpu.wado",
    "gemma3-270m/**",
]
