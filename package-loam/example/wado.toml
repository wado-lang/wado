# Loam as a consumer uses it: the generator a build dependency, its runtime an
# ordinary one, under the same name.
[package]
name = "loam-example"
version = "0.0.0"

[build-dependencies]
"lib:loam" = { path = "..", package = "wado-lang:loam", version = "^0.0.28" }

[dependencies]
"lib:loam" = { path = "..", package = "wado-lang:loam", version = "^0.0.28" }

[test]
# Gemma's tokenizer and checkpoint are too large to commit; `fetch.sh` puts them
# in its `build/`. Name its test files to run them. GPT-2's checkpoint is too
# large as well, and the build reads its header, so the files naming the model
# compile only once its `fetch.sh` has run; its tokenizer's test needs none.
exclude = [
    "build/**",
    "gpt2-124m/build/**",
    "gpt2-124m/generate_test.wado",
    "gpt2-124m/gpt2.wado",
    "gpt2-124m/model.wado",
    "gpt2-124m/webgpu.wado",
    "gemma3-270m/**",
]
