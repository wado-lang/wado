# Grog as a consumer uses it: the generator a build dependency, its runtime an
# ordinary one, under the same name.
[package]
namespace = "wado-lang"
name = "grog-roundtrip"
version = "0.0.0"

[build-dependencies]
"wado-lang:grog" = { path = "../.." }

[dependencies]
"wado-lang:grog" = { path = "../.." }

[test]
exclude = ["build/**"]
