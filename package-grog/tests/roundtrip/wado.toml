# Grog as a consumer uses it: the generator a build dependency, its runtime an
# ordinary one, under the same name.
[package]
name = "grog-roundtrip"
version = "0.0.0"

[build-dependencies]
"lib:grog" = { path = "../..", package = "wado-lang:grog", version = "^0.0.28" }

[dependencies]
"lib:grog" = { path = "../..", package = "wado-lang:grog", version = "^0.0.28" }

[test]
exclude = ["build/**"]
