[package]
name = "windrow"
description = "Windrow — finds code that repeats one shape, read off a Gale grammar's tree"
repository-directory = "package-windrow"
lib = "src/lib.wado"
# version / repository / namespace / license / authors inherited from [workspace.package]

[world]
"wasi:cli/command" = "src/main.wado"

[dependencies]
"wado-lang:gale" = { path = "../package-gale" }

[test]
# `build/` holds Kiln intermediates; not source.
exclude = ["build/**"]
