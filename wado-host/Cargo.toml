[package]
name = "wado-host"
version = { workspace = true }
edition = "2024"
description = "Native host pieces shared by the Wado CLI, its dev tools, its runners, and the compiler's tests"
license = { workspace = true }

[features]
default = ["toolchain"]
# What needs the compiler. A runner calls `wado` as a program and turns this
# off: `wado-run-webgpu`, a workspace of its own, would otherwise build it.
toolchain = [
    "dep:wado-compiler",
    "dep:wado-lsp",
    "dep:wado-manifest",
    "dep:iana-time-zone",
    "dep:indexmap",
    "dep:libc",
    "dep:rand",
    "dep:rustls",
    "dep:rustls-webpki",
    "dep:serde",
    "dep:serde_json",
    "dep:webpki-roots",
]

[dependencies]
wado-compiler = { path = "../wado-compiler", optional = true }
wado-lsp = { path = "../wado-lsp", optional = true }
wado-manifest = { path = "../wado-manifest", optional = true }
anyhow = { workspace = true }
iana-time-zone = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
lexopt = { workspace = true }
libc = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-webpki = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true }
tokio = { workspace = true }
webpki-roots = { workspace = true, optional = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmparser = { workspace = true }

[lints]
workspace = true
