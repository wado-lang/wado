<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wado Playground</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 1rem; }
      h1 { font-size: 1.1rem; }
      textarea { width: 100%; height: 12rem; font-family: ui-monospace, monospace; }
      button { padding: 0.4rem 1rem; font-size: 1rem; }
      pre { background: #111; color: #eee; padding: 0.75rem; overflow: auto; min-height: 3rem; white-space: pre-wrap; }
      .err { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <h1>Wado Playground — compile &amp; run in the browser</h1>
    <p>Compiler and jco both run as WebAssembly, entirely client-side. Needs a JSPI-capable browser (Chrome/Chromium 137+).</p>
    <textarea id="src">use { println, Stdout } from "core:cli";

export fn run() with Stdout {
    println("Hello from a browser-side Wado compiler!");
}
</textarea>
    <p><button id="run">Run</button> <span id="status"></span></p>
    <pre id="out"></pre>

    <script type="module">
      import { run } from "./playground.js";

      const $ = (id) => document.getElementById(id);
      const status = (t) => ($("status").textContent = t);

      // Run in a worker so the (potentially slow, on mobile) compile does not
      // freeze the page: the main thread stays free to paint each progress
      // message the worker streams back.
      function runInWorker(source, onEvent) {
        const worker = new Worker("./runner-worker.js", { type: "module" });
        const out = { stdout: "", stderr: "" };
        return new Promise((resolve, reject) => {
          worker.onmessage = (e) => {
            const m = e.data;
            if (m.type === "stdout" || m.type === "stderr") out[m.type] += m.text;
            else onEvent?.(m);
            if (m.type === "done") resolve({ ...out, ms: m.ms });
            if (m.type === "error") reject(new Error(m.text));
          };
          worker.onerror = (e) => reject(new Error(e.message || "worker error"));
          worker.postMessage({ type: "run", source });
        }).finally(() => worker.terminate());
      }

      async function go(source) {
        $("out").textContent = "";
        $("out").classList.remove("err");
        // Coarse stage (compiling/transpiling/running) plus the current
        // fine-grained compiler phase, shown as one live progress line.
        let stage = "compiling";
        status("compiling…");
        const result = await runInWorker(source, (m) => {
          if (m.type === "status") { stage = m.phase; status(`${stage}…`); }
          else if (m.type === "phase") status(`${stage}… (${m.name})`);
        });
        $("out").textContent =
          (result.stdout + (result.stderr ? "\n[stderr]\n" + result.stderr : "")) || "(no output)";
        status(`done in ${result.ms} ms`);
        return result;
      }

      // Disable the button for the duration of a run: a second click would
      // spawn another worker whose output races into the same panel.
      $("run").addEventListener("click", async () => {
        const btn = $("run");
        if (btn.disabled) return;
        btn.disabled = true;
        try {
          await go($("src").value);
        } catch (e) {
          $("out").textContent = String(e.message ?? e);
          $("out").classList.add("err");
          status("error");
        } finally {
          btn.disabled = false;
        }
      });

      // Test hook: lets Playwright drive a run and read the result.
      globalThis.__wadoRun = (source) => run(source ?? $("src").value);
    </script>
  </body>
</html>
