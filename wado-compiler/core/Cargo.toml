[package]
name = "wado-compiler-core"
version = { workspace = true }
edition = "2024"
description = "The Wado compiler below the optimizer, from parsing to NIR"
license = { workspace = true }

# The sources stay in `wado-compiler/src`, beside the crate built on top of them.
[lib]
name = "wado_compiler_core"
path = "../src/core.rs"

[dependencies]
wado-wasm-embed = { path = "../../wado-wasm-embed" }
cranelift-entity = { workspace = true }
fluent-uri = { workspace = true }
heck = { workspace = true }
indexmap = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
wasm-encoder = { workspace = true }
wasmparser = { workspace = true }
wat = { workspace = true }
wit-encoder = { workspace = true }
wit-parser = { workspace = true }
wit-component = { workspace = true }
wasm-compose = { workspace = true }
anyhow = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
wasmprinter = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true
