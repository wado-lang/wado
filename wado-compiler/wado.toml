[package]
name = "wado-compiler"
version = "0.1.0"

[test]
# E2E compiler test fixtures (`tests/`) are not Wado source code in the
# library sense — they are compile-and-run scenarios driven by `cargo test`
# via `tests/e2e.rs`. Skip them in `wado test` discovery; otherwise they
# would be (re)compiled here under the test world.
#
# `lib/core/prelude/**` carries no `test` blocks of its own — the
# `*_test.wado` siblings below hold those.
#
# `lib/core/allocator.wado` is `#![wasm_module("mem")]`: its code lands in
# `mem`, leaving no component to emit, so an entry declaring one is rejected.
#
# `lib/core/log_level_test.wado` asserts on events below `Warn`, which the
# `-D log.level=warn` `wado test` builds with compiles away. `mise run
# test-log-levels` names it with a tier-1 level that admits them.
exclude = [
    "tests/**",
    "lib/core/prelude/**",
    "lib/core/allocator.wado",
    "lib/core/log_level_test.wado",
]

# The prelude's own tests live inside the excluded `lib/core/prelude/**`, so this
# override keeps them visible to discovery. It names that directory rather than
# all of `lib/`, because an include always beats an exclude: a blanket
# `lib/**/*_test.wado` would undo the exclusions above too.
include = [
    "lib/core/prelude/**/*_test.wado",
]

[format]
# The e2e compiler fixtures and golden format fixtures under `tests/` have
# intentional, hand-authored layouts that are part of the test, so they are
# excluded from `wado format`. Everything else (the stdlib in `lib/`,
# including the prelude and `*_test.wado` files) is real source and is
# formatted.
exclude = ["tests/**"]
