[package]
name = "wado-compiler"
version = { workspace = true }
edition = "2024"
description = "Compiler for the Wado programming language"
license = { workspace = true }
# The tests are the `wado-compiler-tests` package in `tests/`.
autotests = false

[lib]
name = "wado_compiler"
path = "src/lib.rs"

[dependencies]
wado-wasm-embed = { path = "../wado-wasm-embed" }
cranelift-entity = { workspace = true }
fluent-uri = { workspace = true }
heck = { workspace = true }
indexmap = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
wasm-encoder = { workspace = true }
wasmparser = { workspace = true }
wat = { workspace = true }
wit-encoder = { workspace = true }
wit-parser = { workspace = true }
wit-component = { workspace = true }
wasm-compose = { workspace = true }
anyhow = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
