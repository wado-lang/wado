# Local patch of wasmtime-wasi-http 43.0.0
# Adds default authority ("localhost") and path ("/") for HTTP/HTTPS requests
# when the guest doesn't set them, preventing HttpRequestUriInvalid.
[package]
name = "wasmtime-wasi-http"
version = "43.0.0"
edition = "2024"
rust-version = "1.91.0"
license = "Apache-2.0 WITH LLVM-exception"
description = "Experimental HTTP library for WebAssembly in Wasmtime (patched)"

[features]
default = []
default-send-request = ["dep:tokio-rustls", "dep:rustls", "dep:webpki-roots"]
p2 = ["wasmtime-wasi/p2"]
p3 = ["wasmtime-wasi/p3", "dep:tokio-util"]
component-model-async = ["futures/alloc", "wasmtime/component-model-async"]

[dependencies]
async-trait = "0.1.89"
bytes = { version = "1.11.1", default-features = false }
futures = { version = "0.3.31", default-features = false }
hyper = "1.7.0"
tokio = { version = "1.48.0", features = ["net", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7.16", optional = true }
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
tracing = { version = "0.1.41", default-features = false }
wasmtime-wasi = { version = "43.0.0", default-features = false }
wasmtime-wasi-io = { version = "43.0.0", default-features = false }
wasmtime = { version = "43.0.0", default-features = false, features = ["component-model"] }
tokio-rustls = { version = "0.25.0", optional = true }
rustls = { version = "0.22.0", optional = true }
webpki-roots = { version = "0.26.0", optional = true }

[lints.clippy]
# Match the upstream wasmtime lint config
pedantic = { level = "warn", priority = -1 }
too_many_arguments = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
too_many_lines = "allow"
type_complexity = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
struct_excessive_bools = "allow"
enum_variant_names = "allow"
struct_field_names = "allow"
doc_link_with_quotes = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
manual_let_else = "allow"
unnecessary_wraps = "allow"
similar_names = "allow"
trivially_copy_pass_by_ref = "allow"
ref_option = "allow"
