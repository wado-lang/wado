# Data-free collator feature component (marker-dedup demo). icu_collator without
# compiled_data; loads collation + NFD-normalization data from the shared blob
# via BlobDataProvider.
[workspace]
[package]
name = "cn-collator"
version = "0.0.0"
edition = "2024"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
icu_collator = { version = "2.2", default-features = false, features = ["serde"] }
icu_locale_core = { version = "2.2", default-features = false }
icu_provider_blob = { version = "2.2", default-features = false, features = ["alloc"] }
wit-bindgen = { version = "0.58", default-features = false, features = ["macros", "realloc"] }
dlmalloc = { version = "0.2", features = ["global"] }
[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
