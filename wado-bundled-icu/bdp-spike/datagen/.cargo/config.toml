# This datagen tool is a NATIVE host program (it fetches CLDR data and writes a
# blob file). The parent wado-bundled-icu/.cargo/config.toml sets the build
# target to wasm32-unknown-unknown for the bundled wasm crate; override it here
# so cargo builds for the host triple instead.
[build]
target = "x86_64-unknown-linux-gnu"
