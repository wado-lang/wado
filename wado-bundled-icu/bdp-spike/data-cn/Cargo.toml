# Shared data component for the collator+normalizer demo: bakes the shared blob
# (collator + normalizer markers) and serves it. One data copy for both features.
[workspace]
[package]
name = "cn-data"
version = "0.0.0"
edition = "2024"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
wit-bindgen = { version = "0.58", default-features = false, features = ["macros", "realloc"] }
dlmalloc = { version = "0.2", features = ["global"] }
[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
