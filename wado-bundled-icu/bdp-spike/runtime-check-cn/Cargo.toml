# Native host check for the collator+normalizer marker-dedup demo. Feeds the ONE
# shared blob to both data-free feature components and asserts correct results,
# then runs the composed (feature+shared-data) components with an empty linker.
[workspace]
[package]
name = "cn-runtime-check"
version = "0.0.0"
edition = "2024"
publish = false
[dependencies]
anyhow = "1"
wasmtime = { path = "../../../vendor/wasmtime/crates/wasmtime", features = ["component-model"] }
