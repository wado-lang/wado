# Build the no_std crate to a core wasm module. wasm32-unknown-unknown has no
# WASI and no std, so the result imports nothing — a fully self-contained module
# (like wado-bundled-libm). A post-build `wasm-tools component new` step wraps it
# into a Component Model component using the component-type section embedded by
# wit-bindgen's `generate!` macro.
[build]
target = "wasm32-unknown-unknown"

