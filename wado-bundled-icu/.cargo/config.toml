# Build directly to a Component Model component. The wasm32-wasip2 target's
# linker (wasm-component-ld) wraps the core module — together with the
# component-type custom section embedded by wit-bindgen's `generate!` macro —
# into a component, so `cargo build` alone yields a .wasm component with no
# external wasm-tools CLI required.
[build]
target = "wasm32-wasip2"
