[package]
name = "web"
description = "Web platform bindings for Wado, generated from WebIDL"
repository-directory = "package-web"
lib = "src/lib.wado"
# version / repository / namespace / license / authors inherited from [workspace.package]

[format]
# `wado-from-idl` writes the bindings, and `tests/web_dom_is_fresh.rs` holds them
# to its output byte for byte, so formatting them would undo a regeneration.
exclude = ["src/dom.wado"]
