# Mise configuration for Wado project
# https://mise.jdx.dev/
# Schema: https://mise.jdx.dev/schema/mise.json

[tools]
# Rust toolchain - mise respects rust-toolchain.toml automatically

# dprint - fast code formatter
dprint = "latest"

# WebAssembly toolchain for parsing, printing, and validating Wasm
"github:bytecodealliance/wasm-tools" = "latest"

# WebAssembly runtime with WASI P3 support (matches Cargo.toml wasmtime = "41")
wasmtime = "41"

# Node.js - required for VS Code extension development
node = "24"

# Optional tools below are NOT in [tools] because mise doesn't support per-tool
# optional flag. They are installed best-effort via `make on-task-started`.
#   github:cli/cli = "latest"  # GitHub CLI

[settings]
# Automatically install missing tools when entering the directory
auto_install = true

# Use verbose output for debugging (can be set to false for quieter operation)
verbose = false

[tasks.sync-vendor]
description = "Sync vendor submodules (wasmtime pinned to Cargo.lock, others to latest)"
run = "scripts/sync-vendor.sh"

[tasks.list-todo]
description = "List E2E test fixtures marked with TODO: true"
run = """
grep -l '"TODO": true' wado-compiler/tests/fixtures/*.wado 2>/dev/null | \
  sort
"""

[tasks.update-golden-format-fixtures]
description = "Regenerate format fixture golden files (clean, TIR, lower, optimize, WIR, WAT)"
file = "scripts/update-golden-format-fixtures.sh"

[tasks.doc-stdlib]
description = "Generate stdlib cheatsheet docs (core + wasi)"
run = """
set -e
cargo build --bin wado --quiet

CORE_MODULES="core:prelude core:cli core:collections core:base64 core:zlib"
WASI_MODULES="wasi:cli wasi:filesystem wasi:http wasi:clocks wasi:random wasi:sockets"

echo "Generating docs/cheatsheet-stdlib-core.md..."
cargo run --bin wado --quiet -- doc -f simple --title "Core Standard Library" \
  $CORE_MODULES > docs/cheatsheet-stdlib-core.md

echo "Generating docs/cheatsheet-stdlib-wasi.md..."
cargo run --bin wado --quiet -- doc -f simple --title "WASI Standard Library" \
  $WASI_MODULES > docs/cheatsheet-stdlib-wasi.md

echo "Generating docs/stdlib-core.md..."
cargo run --bin wado --quiet -- doc -f markdown --title "Core Standard Library" \
  $CORE_MODULES > docs/stdlib-core.md

echo "Generating docs/stdlib-wasi.md..."
cargo run --bin wado --quiet -- doc -f markdown --title "WASI Standard Library" \
  $WASI_MODULES > docs/stdlib-wasi.md

echo "Done."
"""
