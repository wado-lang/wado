# Mise configuration for Wado project
# https://mise.jdx.dev/
# Schema: https://mise.jdx.dev/schema/mise.json

[tools]
# Rust toolchain - mise respects rust-toolchain.toml automatically

# dprint - fast code formatter
dprint = "latest"

# WebAssembly runtime with WASI P3 support (synced by sync-vendor.sh)
wasmtime = "44"

# Node.js - required for VS Code extension development
node = "24"

# Optional tools below are NOT in [tools] because mise doesn't support per-tool
# optional flag. They are installed best-effort via `mise run on-task-started`.
#   github:cli/cli = "latest"  # GitHub CLI

[settings]
auto_install = true
lockfile = true
verbose = false

[env]
RUSTFLAGS = {value = "-D warnings", default = true}

[tasks.on-task-started]
description = "Install project development tools"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
mise install
mise install github:cli/cli@latest 2>&1 || true
"""

[tasks.on-task-done]
description = "Format, clippy-fix, update golden fixtures, regenerate stdlib docs, and test"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo build

mise run clippy-fix
# mise run update-bundled # platform affects the WAT
mise run update-golden-fixtures
mise run update-golden-format-fixtures
mise run doc-stdlib
mise run format
mise run test
mise run test-wado
"""

[tasks.build]
description = "Check Rust crates (host + wasm32 targets)"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo check
cargo check -p wado-compiler --target wasm32-unknown-unknown
cargo check -p wado-manifest --target wasm32-unknown-unknown
"""

[tasks.hello]
description = "Compile example/hello.wado to WAT and Wasm"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo run -p wado-cli -- compile -O2 -o example/hello.wat  example/hello.wado
cargo run -p wado-cli -- compile -O2 -o example/hello.wasm example/hello.wado
"""

[tasks.hello-run]
description = "Run example/hello.wado"
run = "cargo run -p wado-cli -- run example/hello.wado"

[tasks.hello-run-wasmtime]
description = "Compile and run hello.wado directly with wasmtime"
depends = ["hello"]
run = "wasmtime run -S p3=y -W component-model=y -W component-model-gc=y -W component-model-async=y -W component-model-async-builtins=y -W component-model-async-stackful=y -W gc=y -W function-references=y -W simd=y -W wide-arithmetic=y -W threads=y --invoke 'run()' example/hello.wasm"

[tasks.test]
description = "Run Rust crate tests"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
touch wado-compiler/tests/e2e.rs
# Cap the harness thread count. Each e2e test compiles a Wado program and
# runs it under wasmtime; at full nproc on constrained sandboxes we have
# seen SIGSEGV from resource exhaustion. Use nproc/3 (min 1) which matches
# the wado-dev-tools default.
test_threads=$(( $(nproc) / 3 ))
[ "$test_threads" -lt 1 ] && test_threads=1
cargo test -- --test-threads="$test_threads"
"""

[tasks.test-wado]
description = "Run Wado module tests"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
# In CI, package-gale runs in its own per-optlevel jobs (test-gale-o1/o2/o3)
# so it is excluded here to keep this job fast. Locally, we include it so
# a single `mise run test-wado` covers everything.
targets=(example/*.wado wado-compiler/lib/core wasm-size/*/*.wado)
if [ -z "${CI:-}" ]; then
    targets+=(package-gale)
fi
cargo run -p wado-cli -- test "${targets[@]}"
cargo run -p wado-cli -- test --dir benchmark::. benchmark/*/*.wado
"""

[tasks.test-gale-o1]
description = "Run package-gale tests with -O1"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo run -p wado-cli -- test -O1 package-gale
"""

[tasks.test-gale-o2]
description = "Run package-gale tests with -O2"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo run -p wado-cli -- test -O2 package-gale
"""

[tasks.test-gale-o3]
description = "Run package-gale tests with -O3"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo run -p wado-cli -- test -O3 package-gale
"""

[tasks.test-cov]
description = "Run tests with coverage"
run = "cargo llvm-cov --all-features --workspace"

[tasks.test-cov-html]
description = "Run tests with coverage (HTML report)"
run = "cargo llvm-cov --all-features --workspace --html"

[tasks.format]
description = "Format Rust and Markdown files"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo fmt --all
dprint fmt
"""

[tasks.format-wado]
description = "Format all Wado source files"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo run --bin wado -- format -w \
    $(grep -L '"compile_error"' wado-compiler/tests/fixtures/**/*.wado) \
    $(find wado-compiler/lib example benchmark wasm-size package-gale/src -name '*.wado')
"""

[tasks.clippy]
description = "Run clippy checks"
run = "cargo clippy --all --all-features --all-targets -- -D warnings"

[tasks.clippy-fix]
description = "Run clippy auto-fix"
run = "cargo clippy --all --all-features --all-targets --fix --allow-dirty --allow-staged"

[tasks.update-golden-fixtures]
description = "Regenerate WIR golden fixtures"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
mkdir -p wado-compiler/tests/fixtures.golden
rm -rf wado-compiler/tests/fixtures.golden/*.*
./target/debug/wado-dev-tools golden-dump \
    --in 'wado-compiler/tests/fixtures/{name}.wado' \
    --out 'wado-compiler/tests/fixtures.golden/{name}.wir.wado' \
    --phase wir -O2
"""

[tasks.update-golden-format-fixtures]
description = "Regenerate format fixture golden files (clean, TIR, lower, optimize, WIR, WAT)"
file = "scripts/update-golden-format-fixtures.sh"

[tasks.doc-stdlib]
description = "Generate stdlib reference docs (one file per core module, combined wasi)"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo build --bin wado --quiet

CORE_MODULES="prelude cli collections base64 zlib serde json json_nsd json_value simd url kiln"
WASI_MODULES="wasi:cli wasi:filesystem wasi:http wasi:clocks wasi:random wasi:sockets"

for m in $CORE_MODULES; do
  cargo run --bin wado --quiet -- doc -f markdown "core:$m" \
    > "docs/stdlib-core-$m.md"
done
cargo run --bin wado --quiet -- doc -f markdown --title "WASI Standard Library" \
  $WASI_MODULES > docs/stdlib-wasi.md
"""

[tasks.clean]
description = "Clean all build artifacts"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo clean
rm -f example/*.wat example/*.wasm
mise run -C benchmark clean
mise run -C wasm-size clean
"""

[tasks.install-wado-vscode-dev]
description = "Install wado-vscode extension for development"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cd wado-vscode
npm install && npm run compile
if [ -e ~/.vscode/extensions/wado-lang.wado-0.0.1 ]; then
    echo "wado-vscode is already installed"
else
    ln -s "$PWD" ~/.vscode/extensions/wado-lang.wado-0.0.1
fi
"""

[tasks.clean-wado-vscode-dev]
description = "Remove wado-vscode development symlink"
run = "rm -f ~/.vscode/extensions/wado-lang.wado-0.0.1"

[tasks.test-wado-vscode]
description = "Run wado-vscode tests"
run = "cd wado-vscode && npm install && npm run test:unit && npm run test"

[tasks.build-wado-lsp-wasm]
description = "Build wado-lsp for wasm32-wasip1 and copy into wado-vscode/out/"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
# @vscode/wasm-wasi-lsp hosts wasm32-wasip1 modules only; the p2 component
# target is not yet consumable by the VS Code Wasm host. See
# docs/wep-2026-04-18-lsp-architecture.md (fallback noted in Prerequisites).
cargo build -p wado-lsp --bin wado-lsp --target wasm32-wasip1 --release
mkdir -p wado-vscode/out
cp target/wasm32-wasip1/release/wado-lsp.wasm wado-vscode/out/wado_lsp.wasm
"""

[tasks.watch-wado-lsp-wasm]
description = "Watch wado-lsp and rebuild the wasm32-wasip1 artifact on change"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo watch \
    -w wado-lsp \
    -w wado-compiler \
    -w wado-manifest \
    -s 'mise run build-wado-lsp-wasm'
"""

[tasks.update-wado-vscode-grammar]
description = "Regenerate wado-vscode syntax files from syntax.rs"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo run --bin wado -- syntax --format tmLanguage -o wado-vscode/syntaxes/wado.tmLanguage.json
cargo run --bin wado -- syntax --format language-config -o wado-vscode/language-configuration.json
"""

[tasks.update-json-schema-files]
description = "Download TextMate grammar and language-configuration JSON schemas"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
mkdir -p wado-cli/schemas
curl -sL "https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json" \
    | sed 's|"$schema": "http://json-schema.org/schema#"|"$schema": "http://json-schema.org/draft-07/schema#"|g; s|"id":|"$id":|g' \
    > wado-cli/schemas/tmlanguage.schema.json
curl -sL "https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/language-configuration.json" \
    > wado-cli/schemas/language-configuration.schema.json
"""

[tasks.sync-vendor]
description = "Sync vendor submodules (wasmtime pinned to Cargo.lock, others to latest)"
run = "scripts/sync-vendor.sh"

[tasks.update-vendor]
description = "Update all vendor submodules to latest remote"
run = "git submodule update --remote vendor/wasm vendor/wasi vendor/wasmtime vendor/wasm-tools"

[tasks.update-stdlib-wasi]
description = "Regenerate wasi stdlib from WIT files"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
rm -rf wado-compiler/lib/wasi/
mkdir -p wado-compiler/lib/wasi/
cargo run -p wado-from-idl -- \
    --wit-dir vendor/wasmtime/crates/wasi-http/src/p3/wit \
    --output-dir wado-compiler/lib/wasi
cargo run -p wado-from-idl -- \
    --wit-dir vendor/wasmtime/crates/wasi/src/p3/wit \
    --output-dir wado-compiler/lib/wasi
cargo run -p wado-from-idl -- \
    --wit-dir vendor/wasmtime/crates/wasi-tls/src/p3/wit \
    --output-dir wado-compiler/lib/wasi
"""

[tasks.update-stdlib-kiln]
description = "Regenerate core:kiln stdlib submodules from WIT file (facade is hand-written)"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
# Clean the auto-generated submodules; the facade `lib/core/kiln.wado`
# is hand-written and must be preserved.
rm -f wado-compiler/lib/core/kiln/*.wado
cargo run -p wado-from-idl -- \
    --wit-dir wado-compiler/lib/core/kiln \
    --output-dir wado-compiler/lib/core \
    --skip-flat-reexport
"""

[tasks.update-bundled]
description = "Rebuild bundled libm Wasm module"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cd wado-bundled-libm && CARGO_PROFILE_RELEASE_OPT_LEVEL=s CARGO_PROFILE_RELEASE_LTO=true cargo build --release && cd ..
WAT_FILE="wado-compiler/lib/builtins/wado-bundled-libm.wat"
WAT_TMP="${WAT_FILE}.tmp"
cargo run --bin wado-dev-tools -- wasm2wat target/wasm32-unknown-unknown/release/wado_bundled_libm.wasm > "$WAT_TMP"
if cmp -s "$WAT_TMP" "$WAT_FILE"; then
  rm "$WAT_TMP"
  echo "  bundled libm WAT unchanged, skipping update"
else
  mv "$WAT_TMP" "$WAT_FILE"
  echo "  bundled libm WAT updated"
fi
"""

[tasks.list-todo]
description = "List E2E test fixtures marked with TODO: true"
run = """
grep -l '"TODO": true' wado-compiler/tests/fixtures/*.wado 2>/dev/null | sort
"""

[tasks.benchmark-all]
description = "Run all benchmarks"
run = "mise run -C benchmark all"

[tasks.benchmark-count-prime]
description = "Run count_prime benchmark"
run = "mise run -C benchmark count-prime"

[tasks.benchmark-mandelbrot]
description = "Run mandelbrot benchmark"
run = "mise run -C benchmark mandelbrot"

[tasks.benchmark-sieve]
description = "Run sieve benchmark"
run = "mise run -C benchmark sieve"

[tasks.benchmark-zlib]
description = "Run zlib benchmark"
run = "mise run -C benchmark zlib"

[tasks.benchmark-fts]
description = "Run fts benchmark"
run = "mise run -C benchmark fts"

[tasks.benchmark-json-twitter]
description = "Run json-twitter benchmark"
run = "mise run -C benchmark json-twitter"

[tasks.benchmark-json-canada]
description = "Run json-canada benchmark"
run = "mise run -C benchmark json-canada"

[tasks.benchmark-json-catalog]
description = "Run json-catalog benchmark"
run = "mise run -C benchmark json-catalog"

[tasks.benchmark-sqlite-parse]
description = "Run sqlite-parse benchmark"
run = "mise run -C benchmark sqlite-parse"

[tasks.benchmark-syntax-highlight]
description = "Run syntax-highlight benchmark"
run = "mise run -C benchmark syntax-highlight"

[tasks.report-wasm-size]
description = "Build all languages and report Wasm sizes"
run = "mise run -C wasm-size report-wasm-size"

[tasks.build-jco]
description = "Build patched jco from vendor/jco"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cd vendor/jco
PUPPETEER_SKIP_DOWNLOAD=1 npm install --ignore-scripts 2>&1 | tail -3
cargo build -p xtask --target x86_64-unknown-linux-gnu
./target/x86_64-unknown-linux-gnu/debug/xtask build debug
echo "jco built successfully at vendor/jco"
"""

[tasks.jco-transpile]
description = "Transpile a Wado .wasm component to JS via patched jco"
usage = "jco-transpile <wasm-file> [output-dir]"
run = """
#!/usr/bin/env bash
set -e -o pipefail
WASM_FILE="${1:?Usage: mise run jco-transpile <wasm-file> [output-dir]}"
OUTPUT_DIR="${2:-${WASM_FILE%.wasm}-jco}"
JCO="vendor/jco/packages/jco/src/jco.js"
SHIM_DIR="$(pwd)/example/jco-shim"

if [ ! -f "vendor/jco/packages/jco/obj/js-component-bindgen-component.js" ]; then
  echo "jco not built yet. Run: mise run build-jco"
  exit 1
fi

rm -rf "$OUTPUT_DIR"
node "$JCO" transpile "$WASM_FILE" -o "$OUTPUT_DIR" \
  --map "wasi:cli/*=${SHIM_DIR}/cli.js#*" \
  --map "wasi:random/*=${SHIM_DIR}/random.js#*" \
  --map "wasi:clocks/*=${SHIM_DIR}/clocks.js#*"
echo '{"type": "module"}' > "$OUTPUT_DIR/package.json"
echo "Transpiled to: $OUTPUT_DIR"
"""
