# Mise configuration for Wado project
# https://mise.jdx.dev/
# Schema: https://mise.jdx.dev/schema/mise.json

[tools]
# Rust toolchain - mise respects rust-toolchain.toml automatically

# Markdown formatting is provided by `wado-dev-tools format-md`, which
# embeds the dprint markdown plugin as a Cargo dependency. No external
# dprint CLI is required.

# Node.js - required for VS Code extension development and the jco runtime.
# Node 26 (V8 14.6) ships stable JSPI, so `WebAssembly.Suspending` works without
# `--experimental-wasm-jspi` (which Node 26 no longer accepts).
node = "26"

jq = "latest"

[settings]
auto_install = true
lockfile = true
verbose = false

[env]
RUSTFLAGS = "-D warnings"
_.path = ["vendor/wasmtime/target/release"]

[tasks.on-task-started]
description = "Install project development tools"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
mise install
mise run warm-cache
"""

[tasks.warm-cache]
description = "Reconstruct target/ from the restored sccache cache, then warm the incremental dev loop"
run = """
#!/usr/bin/env bash
# Turns the restored sccache cache (see .claude/hooks/cargo-cache-restore.mts)
# into a warm target/: an ~8 min cold dependency build becomes an ~80s
# sccache-backed rebuild. sccache is used ONLY here — it disables incremental,
# which cripples the edit/rebuild inner loop (measured ~12x slower on
# wado-compiler edits), so we hand off to incremental immediately after.
# No-ops cleanly when sccache or the cache is absent (e.g. local dev).
set -e -o pipefail
export SCCACHE_DIR="${SCCACHE_DIR:-$HOME/.cargo/sccache}"
if ! command -v sccache >/dev/null 2>&1; then
  echo "sccache not installed; skipping warm-cache (normal cold build applies)"
  exit 0
fi
if [ ! -d "$SCCACHE_DIR" ] || [ -z "$(ls -A "$SCCACHE_DIR" 2>/dev/null)" ]; then
  echo "no restored sccache cache at $SCCACHE_DIR; skipping warm-cache"
  exit 0
fi
# 1) Reconstruct dependency artifacts fast from the content-addressed cache.
RUSTC_WRAPPER=sccache CARGO_INCREMENTAL=0 cargo build --workspace --locked
sccache --show-stats || true
# 2) Hand off to incremental so the first real edit is a fast relink rather
#    than a full non-incremental recompile (sccache and incremental are
#    mutually exclusive). Only the workspace crates rebuild here; the cached
#    dependencies are reused.
CARGO_INCREMENTAL=1 cargo build --workspace --locked
"""

[tasks.on-task-done]
description = "Format, clippy-fix, update golden fixtures, regenerate stdlib docs, and test"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo build

mise run clippy-fix
# mise run update-bundled # platform affects the WAT
mise run update-golden-fixtures
mise run update-golden-format-fixtures
mise run doc-stdlib
mise run format
mise run test
mise run test-wado
"""

[tasks.build]
description = "Check Rust crates (host + wasm32 targets)"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo check
cargo check -p wado-compiler --target wasm32-unknown-unknown
cargo check -p wado-lsp --target wasm32-unknown-unknown
cargo check -p wado-manifest --target wasm32-unknown-unknown
"""

[tasks.check-deps]
description = "Fail if wasm-tools crates drift off wasmtime's generation (duplicate 0.x trees)"
run = """
#!/usr/bin/env bash
set -e -o pipefail

# wado pins the wasm-tools family (wasmparser/wasm-encoder/wasmprinter/wit-parser/
# wat) to the same generation wasmtime depends on, so cargo dedupes instead of
# compiling parallel 0.x trees. See [workspace.dependencies] in Cargo.toml. This
# guard fails when a new duplicate sneaks in (e.g. a dep bumped back to a
# different generation, or `wat` floating up past its tilde pin).
#
# A few duplicates are irreducible: they come from transitive deps we do not pin
# directly. List their exact versions in `allow` so the guard ignores them:
#   wasmparser / wasm-encoder 0.245.1  <- walrus 0.26
#   wast 35.0.2                        <- witx <- wasmtime-wasi (wiggle)
# (wit-bindgen's 0.244 generation is pulled by the target-gated `wasip3` guest
#  crate, never reaches the host tree, and so never shows up in `cargo tree -d`.)
family='wasm-encoder|wasmparser|wasmprinter|wasm-metadata|wat|wast|wit-parser|wit-component'
allow='wasmparser v0.245.1|wasm-encoder v0.245.1|wast v35.0.2'

offenders=$(cargo tree -d 2>/dev/null \
    | awk '{print $1, $2}' \
    | grep -E "^(${family}) v" \
    | sort -u \
    | grep -Ev "^(${allow})$" \
    | awk '{seen[$1]++; vers[$1]=vers[$1] " " $2} END {for (n in seen) if (seen[n] > 1) print "  " n ":" vers[n]}' \
    || true)

if [ -n "${offenders}" ]; then
    echo "error: wasm-tools crates are not aligned with wasmtime's generation:" >&2
    echo "${offenders}" >&2
    echo "" >&2
    echo "Pin them in [workspace.dependencies] to match wasmtime, or add the exact" >&2
    echo "version to 'allow' above if it comes from an unpinnable transitive dep." >&2
    exit 1
fi
echo "ok: wasm-tools crates are deduped on wasmtime's generation"
"""

[tasks.release-build]
description = "Build the wado CLI with the release profile (LTO, fully optimized)"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo build --release -p wado-cli
ls -lh target/release/wado
"""

[tasks.ghcr-login]
description = "Write ghcr.io auth into ~/.docker/config.json from a GitHub token (cloud GITHUB_TOKEN / local gh keyring)"
run = """
#!/usr/bin/env bash
set -e -o pipefail

token="${GITHUB_TOKEN:-${GH_TOKEN:-$(gh auth token 2>/dev/null || true)}}"
if [ -z "${token}" ]; then
  echo "error: no GitHub token; set GITHUB_TOKEN/GH_TOKEN or run 'gh auth login'" >&2
  exit 1
fi
user="${GHCR_USER:-x-access-token}"
auth="$(jq -rn --arg s "${user}:${token}" '$s | @base64')"

cfg="$HOME/.docker/config.json"
mkdir -p "$HOME/.docker"
[ -f "$cfg" ] || echo '{}' > "$cfg"
tmp="$(mktemp)"
jq --arg a "$auth" '.auths["ghcr.io"].auth = $a' "$cfg" > "$tmp"
mv "$tmp" "$cfg"
chmod 600 "$cfg"
echo "ok: wrote ghcr.io auth to $cfg"
"""

[tasks.hello]
description = "Compile example/hello.wado to WAT and Wasm"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo run -p wado-cli -- compile -O2 -o example/hello.wat  example/hello.wado
cargo run -p wado-cli -- compile -O2 -o example/hello.wasm example/hello.wado
"""

[tasks.hello-run]
description = "Run example/hello.wado"
run = "cargo run -p wado-cli -- run example/hello.wado"

[tasks.build-wasmtime]
description = "Build the wasmtime CLI from vendor/wasmtime (matches the embedded crate version)"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
# vendor/wasmtime is a separate workspace tracking upstream dev; its source is
# not warning-clean, so drop the repo-wide `-D warnings` for this build.
RUSTFLAGS= cargo build --release -p wasmtime-cli --manifest-path vendor/wasmtime/Cargo.toml
"""

[tasks.hello-run-wasmtime]
description = "Compile and run hello.wado directly with wasmtime"
depends = ["hello", "build-wasmtime"]
run = "wasmtime run -S p3=y -W component-model-gc=y -W component-model-async=y -W component-model-more-async-builtins=y -W component-model-async-stackful=y -W gc=y -W function-references=y -W wide-arithmetic=y -W branch-hinting=y --invoke 'run()' example/hello.wasm"

[tasks.test]
description = "Run Rust crate tests"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
touch wado-compiler/tests/e2e.rs
# Run the harness with nproc-1 (floor 1) threads. Each e2e test compiles a
# Wado program and runs it under wasmtime; wasmtime spawns its own worker
# threads (codegen, epoch ticker, async I/O), so leaving one core free for
# them avoids contention. The previous fixed cap of 2 was a workaround for
# SIGSEGV from resource exhaustion on a constrained sandbox; reinstate that
# cap if it recurs.
n=$(nproc); threads=$(( n > 1 ? n - 1 : 1 ))
cargo test -- --test-threads="$threads"
"""

[tasks.test-wado]
description = "Run Wado module tests"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
# `wado test` walks the repo-root wado.toml and recurses into every
# nested package. In CI, package-gale runs in its own per-optlevel jobs
# (test-gale-o1/o2/o3), so we exclude it here to keep this job fast.
# Locally we include everything so a single `mise run test-wado` covers
# it all. CI also switches to `--format tap` for its machine-readable
# per-test output; the default `heartbeat` format is for local/agent use.
#
# benchmark/* test blocks use only inline data — the `Preopens`-driven
# file reads sit in `export fn run()`, which the test world does not
# invoke — so they need no `--dir` setup of their own.
extra_args=()
if [ -n "${CI:-}" ]; then
    extra_args+=(--exclude 'package-gale/**' --format tap)
fi
cargo run -p wado-cli -- test "${extra_args[@]}"
"""

[tasks.test-gale-o1]
description = "Run package-gale tests with -O1"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
extra_args=()
if [ -n "${CI:-}" ]; then
    extra_args+=(--format tap)
fi
cargo run -p wado-cli -- test -O1 package-gale "${extra_args[@]}"
"""

[tasks.test-gale-o2]
description = "Run package-gale tests with -O2"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
extra_args=()
if [ -n "${CI:-}" ]; then
    extra_args+=(--format tap)
fi
cargo run -p wado-cli -- test -O2 package-gale "${extra_args[@]}"
"""

[tasks.test-gale-o3]
description = "Run package-gale tests with -O3"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
extra_args=()
if [ -n "${CI:-}" ]; then
    extra_args+=(--format tap)
fi
cargo run -p wado-cli -- test -O3 package-gale "${extra_args[@]}"
"""

[tasks.test-cov]
description = "Run tests with coverage"
run = "cargo llvm-cov --all-features --workspace"

[tasks.test-cov-html]
description = "Run tests with coverage (HTML report)"
run = "cargo llvm-cov --all-features --workspace --html"

[tasks.test-format]
description = """\
Run formatter invariant tests over the fixtures + stdlib corpus: idempotency, \
AST round-trip, and no comment drop. The corpus is not reformatted in place \
(fixtures double as parser tests), but it is the richest edge-case input.\
"""
run = "cargo test -p wado-compiler --test format"

[tasks.format]
description = "Format Rust and Markdown files"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo fmt --all
cargo run -p wado-dev-tools --quiet -- format-md
"""

[tasks.format-wado]
description = "Format all Wado source files"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
# Format the whole workspace. Each package's wado.toml [format] section
# controls its own exclusions (e.g. wado-compiler excludes `tests/**`);
# generated/ and build/ directories, vendor submodules, and gitignored paths
# are skipped automatically.
cargo run --bin wado -- format -w .
"""

[tasks.clippy]
description = "Run clippy checks"
run = "cargo clippy --all --all-features --all-targets -- -D warnings"

[tasks.clippy-fix]
description = "Run clippy auto-fix"
run = "cargo clippy --all --all-features --all-targets --fix --allow-dirty --allow-staged"

[tasks.build-golden-tools]
description = "Build the debug binaries the golden-fixture tasks run"
run = "cargo build --bin wado --bin wado-dev-tools"

[tasks.update-golden-fixtures]
description = "Regenerate WIR golden fixtures"
depends = ["build-golden-tools"]
run = """
#!/usr/bin/env bash
set -xe -o pipefail
# golden-dump overwrites each golden file in place and, only after every file
# has been regenerated, prunes the stale ones (no matching fixture). There is
# no point at which the golden files are all deleted, so `git status` never
# shows a scary mass deletion mid-run.
mkdir -p wado-compiler/tests/generated/fixtures
# A fixture with no __DATA__ section defaults to the test world (matching the
# e2e harness), so `--default-world test` keeps golden-dump and the harness in
# agreement.
./target/debug/wado-dev-tools golden-dump \
    --in 'wado-compiler/tests/fixtures/{name}.wado' \
    --emit wir:'wado-compiler/tests/generated/fixtures/{name}.wir.wado' \
    --default-world test \
    -O2
"""

[tasks.update-golden-format-fixtures]
description = "Regenerate format fixture golden files (clean, NIR, lower, optimize, WIR, WAT)"
depends = ["build-golden-tools"]
file = "scripts/update-golden-format-fixtures.sh"

[tasks.doc-stdlib]
description = "Generate stdlib reference docs (one file per core module, combined wasi)"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo build --bin wado --quiet

CORE_MODULES="core:prelude core:cli core:collections core:base64 core:zlib \
  core:serde core:json core:json_nsd core:args core:value core:cbor core:simd core:url core:kiln \
  core:benchmark core:router core:digest core:uuid core:temporal"
WASI_MODULES="wasi:cli wasi:filesystem wasi:http wasi:clocks wasi:random wasi:sockets wasi:tls"

cargo run --bin wado --quiet -- doc -f markdown -o 'docs/stdlib-{module}.md' \
  $CORE_MODULES
cargo run --bin wado --quiet -- doc -f markdown --title "WASI Standard Library" \
  -o docs/stdlib-wasi.md $WASI_MODULES
"""

[tasks.clean]
description = "Clean all build artifacts"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo clean
rm -f example/*.wat example/*.wasm
mise run -C benchmark clean
mise run -C wasm-size clean
"""

[tasks.install-wado-vscode-dev]
description = "Install wado-vscode extension for development"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cd wado-vscode
npm install && npm run compile
if [ -e ~/.vscode/extensions/wado-lang.wado-0.0.1 ]; then
    echo "wado-vscode is already installed"
else
    ln -s "$PWD" ~/.vscode/extensions/wado-lang.wado-0.0.1
fi
"""

[tasks.clean-wado-vscode-dev]
description = "Remove wado-vscode development symlink"
run = "rm -f ~/.vscode/extensions/wado-lang.wado-0.0.1"

[tasks.test-wado-vscode]
description = "Run wado-vscode tests"
run = "cd wado-vscode && npm install && npm run test:unit && npm run test"

[tasks.build-wado-lsp-wasm-rust]
description = "Build the wado-lsp wasm32-wasip1 binary (-Os) into wado-vscode/out/ (Rust only)"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
# @vscode/wasm-wasi-lsp hosts wasm32-wasip1 modules only; the p2 component
# target is not yet consumable by the VS Code Wasm host. See
# docs/wep-2026-04-18-lsp-architecture.md (fallback noted in Prerequisites).
# Build for size (-Os + LTO, mirroring wado-bundled-libm and the browser
# playground): the bundled server ships in the VSIX and gains nothing from
# speed-oriented codegen.
CARGO_PROFILE_RELEASE_OPT_LEVEL=s CARGO_PROFILE_RELEASE_LTO=true \
  cargo build -p wado-lsp --bin wado-lsp --target wasm32-wasip1 --release
mkdir -p wado-vscode/out
cp target/wasm32-wasip1/release/wado-lsp.wasm wado-vscode/out/wado_lsp.wasm
"""

[tasks.build-wado-lsp-wasm]
description = "Build wado-lsp wasm + wado-vscode TS into wado-vscode/out/"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
mise run build-wado-lsp-wasm-rust

# Compile the extension TS so wado-vscode/out/extension.js stays in sync —
# otherwise a Reload Window picks up stale JS that doesn't match the wasm.
( cd wado-vscode && [ -d node_modules ] || npm install )
( cd wado-vscode && npm run compile )
"""

[tasks.watch-wado-lsp-wasm]
description = "Watch wado-lsp + wado-vscode TS; keep wado-vscode/out/ continuously fresh"
run = """
#!/usr/bin/env bash
set -e -o pipefail

# Make sure node_modules exists before launching tsc -watch.
( cd wado-vscode && [ -d node_modules ] || npm install )

# tsc -watch rebuilds wado-vscode/out/extension.js on every TS edit. VS Code
# does not auto-reload extension code, so you still need
# "Developer: Reload Window" after a TS change — but extension.js is always
# in sync once tsc has rebuilt it.
( cd wado-vscode && exec npm run watch ) &
TSC_PID=$!
trap 'kill -TERM $TSC_PID 2>/dev/null || true; wait $TSC_PID 2>/dev/null || true' EXIT INT TERM

# cargo watch rebuilds the wasm on every Rust change. The extension's
# FileSystemWatcher picks the new wasm up and restarts the LSP server,
# so Rust-only changes do not require a Reload Window. Use the rust-only
# build task so we don't kick off a redundant `npm run compile` on every
# Rust edit (the tsc watcher above already keeps extension.js fresh).
cargo watch \\
    -w wado-lsp \\
    -w wado-compiler \\
    -w wado-manifest \\
    -s 'mise run build-wado-lsp-wasm-rust'
"""

[tasks.update-wado-vscode-grammar]
description = "Regenerate wado-vscode syntax files from syntax.rs"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo run --bin wado -- syntax --format tmLanguage -o wado-vscode/syntaxes/wado.tmLanguage.json
cargo run --bin wado -- syntax --format language-config -o wado-vscode/language-configuration.json
"""

[tasks.update-json-schema-files]
description = "Download TextMate grammar and language-configuration JSON schemas"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
mkdir -p wado-cli/schemas
curl -sL "https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json" \
    | sed 's|"$schema": "http://json-schema.org/schema#"|"$schema": "http://json-schema.org/draft-07/schema#"|g; s|"id":|"$id":|g' \
    > wado-cli/schemas/tmlanguage.schema.json
curl -sL "https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/language-configuration.json" \
    > wado-cli/schemas/language-configuration.schema.json
"""

[tasks.sync-vendor]
description = "Sync vendor submodules (wasmtime pinned to Cargo.lock, others to latest)"
run = "scripts/sync-vendor.sh"

[tasks.update-stdlib-wasi]
description = "Regenerate wasi stdlib from WIT files"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
rm -rf wado-compiler/lib/wasi/
mkdir -p wado-compiler/lib/wasi/
cargo run -p wado-from-idl -- \
    --wit-dir vendor/wasmtime/crates/wasi-http/src/p3/wit \
    --output-dir wado-compiler/lib/wasi
cargo run -p wado-from-idl -- \
    --wit-dir vendor/wasmtime/crates/wasi/src/p3/wit \
    --output-dir wado-compiler/lib/wasi
cargo run -p wado-from-idl -- \
    --wit-dir vendor/wasmtime/crates/wasi-tls/src/p3/wit \
    --output-dir wado-compiler/lib/wasi
find wado-compiler/lib/wasi -type f -name '*.wado' -exec cargo run -p wado-cli -- format -w {} +
"""

[tasks.update-stdlib-kiln]
description = "Regenerate core:kiln stdlib submodules from WIT file (facade is hand-written)"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
# Clean the auto-generated submodules; the facade `lib/core/kiln.wado`
# is hand-written and must be preserved.
rm -f wado-compiler/lib/core/kiln/*.wado
cargo run -p wado-from-idl -- \
    --wit-dir wado-compiler/lib/core/kiln \
    --output-dir wado-compiler/lib/core \
    --skip-flat-reexport
"""

[tasks.update-bundled]
description = "Rebuild bundled libm Wasm module"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cd wado-bundled-libm && CARGO_PROFILE_RELEASE_OPT_LEVEL=s CARGO_PROFILE_RELEASE_LTO=true cargo build --release && cd ..
WAT_FILE="wado-compiler/lib/builtins/wado-bundled-libm.wat"
WAT_TMP="${WAT_FILE}.tmp"
cargo run --bin wado-dev-tools -- wasm2wat target/wasm32-unknown-unknown/release/wado_bundled_libm.wasm > "$WAT_TMP"
if cmp -s "$WAT_TMP" "$WAT_FILE"; then
  rm "$WAT_TMP"
  echo "  bundled libm WAT unchanged, skipping update"
else
  mv "$WAT_TMP" "$WAT_FILE"
  echo "  bundled libm WAT updated"
fi
"""

[tasks.list-todo]
description = "List E2E test fixtures marked with TODO: true"
run = """
grep -l '"TODO": true' wado-compiler/tests/fixtures/*.wado 2>/dev/null | sort
"""

[tasks.benchmark-all]
description = "Run all benchmarks"
run = "mise run -C benchmark all"

[tasks.benchmark-count-prime]
description = "Run count_prime benchmark"
run = "mise run -C benchmark count-prime"

[tasks.benchmark-mandelbrot]
description = "Run mandelbrot benchmark"
run = "mise run -C benchmark mandelbrot"

[tasks.benchmark-sieve]
description = "Run sieve benchmark"
run = "mise run -C benchmark sieve"

[tasks.benchmark-zlib]
description = "Run zlib benchmark"
run = "mise run -C benchmark zlib"

[tasks.benchmark-fts]
description = "Run fts benchmark"
