# Mise configuration for Wado project
# https://mise.jdx.dev/
# Schema: https://mise.jdx.dev/schema/mise.json

[tools]
# Rust is absent because mise reads rust-toolchain.toml; dprint because
# `wado-dev-tools format-md` embeds the markdown plugin as a Cargo dependency.
#
# Node 26 (V8 14.6) ships stable JSPI, so `WebAssembly.Suspending` works without
# `--experimental-wasm-jspi`, which Node 26 no longer accepts.
node = "26"

[settings]
auto_install = true
lockfile = true
verbose = false

[env]
_.path = ["vendor/wasmtime/target/release"]

[tasks.on-task-started]
description = "Install project development tools"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
mise install
"""

[tasks.on-task-done]
description = "Format, clippy-fix, update golden fixtures, regenerate stdlib docs, and test"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo build

mise run clippy-fix
# mise run update-bundled # platform affects the WAT
mise run update-golden-fixtures
mise run update-golden-format-fixtures
mise run doc-stdlib
mise run update-rust-paths-baseline
mise run format
mise run test
mise run test-wado
mise run test-hooks
mise run check-grammar
"""

[tasks.build]
description = "Check Rust crates (host + wasm32 targets)"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo check
cargo check -p wado-compiler --target wasm32-unknown-unknown
cargo check -p wado-lsp --target wasm32-unknown-unknown
cargo check -p wado-manifest --target wasm32-unknown-unknown
"""

[tasks.check-grammar]
description = "Fail if Wado.g4 and the compiler's parser disagree on the stdlib + fixture corpus"
run = "scripts/check-grammar.sh"

[tasks.check-highlight]
description = "Fail if Wado.g4 and the compiler's classifier colour the corpus differently"
run = "scripts/check-highlight.sh"

[tasks.check-highlight-vocab]
description = "Fail if the Gale highlight query drifts from the compiler's syntax registries"
run = "cargo run --bin wado-dev-tools -- highlight-vocab"

[tasks.check-rust-paths]
description = "Fail if a Rust file gained a `crate::` / `super::` path written outside a `use` item"
run = "node scripts/rust-inline-paths.mjs --check"

[tasks.update-rust-paths-baseline]
description = "Record what each Rust file still carries, ratcheting the inline-path baseline down"
run = "node scripts/rust-inline-paths.mjs --update"

[tasks.check-deps]
description = "Fail if wasm-tools crates drift off wasmtime's generation (duplicate 0.x trees)"
run = """
#!/usr/bin/env bash
set -e -o pipefail

# The wasm-tools family is pinned to wasmtime's generation in
# [workspace.dependencies], so cargo dedupes instead of compiling parallel 0.x
# trees. `allow` holds the duplicates from transitive deps we cannot pin:
#   wast 35.0.2                        <- witx <- wasmtime-wasi (wiggle)
family='wasm-encoder|wasmparser|wasmprinter|wasm-metadata|wat|wast|wit-parser|wit-component'
allow='wast v35.0.2'

offenders=$(cargo tree -d 2>/dev/null \
    | awk '{print $1, $2}' \
    | grep -E "^(${family}) v" \
    | sort -u \
    | grep -Ev "^(${allow})$" \
    | awk '{seen[$1]++; vers[$1]=vers[$1] " " $2} END {for (n in seen) if (seen[n] > 1) print "  " n ":" vers[n]}' \
    || true)

if [ -n "${offenders}" ]; then
    echo "error: wasm-tools crates are not aligned with wasmtime's generation:" >&2
    echo "${offenders}" >&2
    echo "" >&2
    echo "Pin them in [workspace.dependencies] to match wasmtime, or add the exact" >&2
    echo "version to 'allow' above if it comes from an unpinnable transitive dep." >&2
    exit 1
fi
echo "ok: wasm-tools crates are deduped on wasmtime's generation"
"""

[tasks.release-build]
description = "Build the wado CLI with the release profile (LTO, fully optimized)"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo build --release -p wado-cli
ls -lh target/release/wado
"""

[tasks.ghcr-login]
description = "Write ghcr.io auth into ~/.docker/config.json from a GitHub token (cloud GITHUB_TOKEN / local gh keyring)"
run = """
#!/usr/bin/env bash
set -e -o pipefail

token="${GITHUB_TOKEN:-${GH_TOKEN:-$(gh auth token 2>/dev/null || true)}}"
if [ -z "${token}" ]; then
  echo "error: no GitHub token; set GITHUB_TOKEN/GH_TOKEN or run 'gh auth login'" >&2
  exit 1
fi
user="${GHCR_USER:-x-access-token}"
auth="$(jq -rn --arg s "${user}:${token}" '$s | @base64')"

cfg="$HOME/.docker/config.json"
mkdir -p "$HOME/.docker"
[ -f "$cfg" ] || echo '{}' > "$cfg"
tmp="$(mktemp)"
jq --arg a "$auth" '.auths["ghcr.io"].auth = $a' "$cfg" > "$tmp"
mv "$tmp" "$cfg"
chmod 600 "$cfg"
echo "ok: wrote ghcr.io auth to $cfg"
"""

[tasks.hello]
description = "Compile example/hello.wado to WAT and Wasm"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo run -p wado-cli -- compile -O2 -o example/hello.wat  example/hello.wado
cargo run -p wado-cli -- compile -O2 -o example/hello.wasm example/hello.wado
"""

[tasks.hello-run]
description = "Run example/hello.wado"
run = "cargo run -p wado-cli -- run example/hello.wado"

[tasks.build-wasmtime]
description = "Build the wasmtime CLI from vendor/wasmtime (matches the embedded crate version)"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
# vendor/wasmtime tracks upstream dev and is not warning-clean, so drop any
# deny-warnings RUSTFLAGS inherited from the environment.
RUSTFLAGS= cargo build --release -p wasmtime-cli --manifest-path vendor/wasmtime/Cargo.toml
"""

[tasks.hello-run-wasmtime]
description = "Compile and run hello.wado directly with wasmtime"
depends = ["hello", "build-wasmtime"]
run = "wasmtime run -S p3=y -W component-model-gc=y -W component-model-async=y -W component-model-more-async-builtins=y -W component-model-async-stackful=y -W gc=y -W function-references=y -W wide-arithmetic=y -W branch-hinting=y --invoke 'run()' example/hello.wasm"

[tasks.test]
description = "Run Rust crate tests"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
touch wado-compiler/tests/e2e.rs
# Leave a core for the threads wasmtime spawns per e2e test (codegen, epoch
# ticker, async I/O). Drop back to a fixed 2 if a constrained sandbox SIGSEGVs.
n=$(nproc); threads=$(( n > 1 ? n - 1 : 1 ))
./scripts/exclusive.sh test cargo test -- --test-threads="$threads"
"""

[tasks.test-wado]
description = "Run Wado module tests"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
# package-gale is excluded in CI only, where test-gale-o3 covers it; locally
# one run walks every nested package. benchmark/* test blocks need no `--dir`:
# their file reads sit in `export fn run()`, which the test world never calls.
# Same batch-compilation shape as `test-gale-o3`, whose comment explains the
# purge and what holding the pages costs in RSS.
export MIMALLOC_PURGE_DELAY=-1
extra_args=()
if [ -n "${CI:-}" ]; then
    extra_args+=(--exclude 'package-gale/**' --format tap)
fi
./scripts/exclusive.sh test-wado cargo run -p wado-cli -- test -O2 "${extra_args[@]}"
"""

[tasks.test-hooks]
description = "Run the Claude Code hook and repo script tests"
run = "node --test .claude/hooks/*.test.mts scripts/*.test.mjs"

[tasks.test-gale-o3]
description = "Run package-gale tests with -O3"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
# A compile builds a working set of several hundred MiB and frees it whole when
# the file is done, so the heap empties once per file. mimalloc's 10ms purge
# timer then returns those pages to the OS just before the next file asks for
# them again, and taking them back costs a fault and a free-list rebuild each:
# 7.0 GiB purged over 24.8K calls to compile four fixtures. Holding them runs
# this suite in 828s against 931s (-11%, compile CPU 3081s against 3442s) for a
# peak RSS of 5941 MiB against 4798, which is comfortable on a 16 GiB runner and
# the first thing to revisit on a smaller one. Serializing the compiles (`-p 1`)
# leaves the page traffic where it was, so it is the per-file heap that costs,
# not the threads. Batch compilation only: `wado serve` is long-running, and
# reclaiming after a spike is what the purge is for. The standing fix is the
# allocation volume itself — ~31% of a compile's CPU is in the allocator.
export MIMALLOC_PURGE_DELAY=-1
extra_args=()
if [ -n "${CI:-}" ]; then
    extra_args+=(--format tap)
fi
./scripts/exclusive.sh test-gale-o3 cargo run -p wado-cli -- test -O3 package-gale "${extra_args[@]}"
"""

[tasks.test-cov]
description = "Run tests with coverage"
run = "cargo llvm-cov --all-features --workspace"

[tasks.test-cov-html]
description = "Run tests with coverage (HTML report)"
run = "cargo llvm-cov --all-features --workspace --html"

[tasks.emi-calibrate]
description = """\
Calibrate the EMI corpus: inject an empty `builtin::black_box(false)` guard at \
every statement boundary of every e2e fixture, stdlib test module and example, \
and keep the ones whose output is unmoved. Writes \
target/emi/{corpus,calibration}.txt. Knobs: WADO_EMI_JOBS, WADO_EMI_FILTER, \
WADO_EMI_ROOTS (fixtures,stdlib,example), WADO_EMI_SHARD (k/n), \
WADO_EMI_LIMIT, WADO_EMI_OUT.\
"""
run = "cargo test -p wado-compiler --test emi -- --ignored --nocapture calibrate_corpus"

[tasks.emi-mutate]
description = """\
Mutate the calibrated EMI corpus: behind an undecidable guard, write to and \
read every binding in scope at every statement boundary, and report any \
source whose output moves. Reads target/emi/corpus.txt, so run emi-calibrate \
first. Writes target/emi/mutation.txt and the reduced mutants under \
target/emi/findings/.\
"""
run = "cargo test -p wado-compiler --test emi -- --ignored --nocapture mutate_corpus"

[tasks.test-format]
description = """\
Run formatter invariant tests over the fixtures + stdlib corpus: idempotency, \
AST round-trip, and no comment drop. The corpus is not reformatted in place \
(fixtures double as parser tests), but it is the richest edge-case input.\
"""
run = "cargo test -p wado-compiler --test format"

# Disjoint file sets, so the three run concurrently — except that the other two
# build the workspace `cargo fmt` is rewriting, so they wait for it. `wait_for`
# orders them without pulling it in, leaving each runnable on its own.
[tasks.format]
description = "Format Rust, Markdown, and Wado files"
depends = ["format-rust", "format-md", "format-wado"]

[tasks.format-rust]
description = "Format Rust files"
run = "cargo fmt --all"

[tasks.format-md]
description = "Format Markdown files"
wait_for = ["format-rust"]
run = "cargo run -p wado-dev-tools --quiet -- format-md"

# Exclusions come from each package's wado.toml [format] (wado-compiler excludes
# `tests/**`); generated/, build/, submodules and gitignored paths are automatic.
[tasks.format-wado]
description = "Format Wado files"
wait_for = ["format-rust"]
run = "cargo run --bin wado -- format -w ."

[tasks.clippy]
description = "Run clippy checks"
run = "cargo clippy --all --all-features --all-targets -- -D warnings"

[tasks.clippy-fix]
description = "Run clippy auto-fix"
run = "cargo clippy --all --all-features --all-targets --fix --allow-dirty --allow-staged"

[tasks.build-golden-tools]
description = "Build the debug binaries the golden-fixture tasks run"
run = "cargo build --bin wado --bin wado-dev-tools"

[tasks.update-golden-fixtures]
description = "Regenerate WIR golden fixtures"
depends = ["build-golden-tools"]
run = """
#!/usr/bin/env bash
set -xe -o pipefail
mkdir -p wado-compiler/tests/generated/fixtures
# `--default-world test` matches the e2e harness, which reads a fixture with no
# __DATA__ section as the test world.
./target/debug/wado-dev-tools golden-dump \
    --in 'wado-compiler/tests/fixtures/{name}.wado' \
    --emit wir:'wado-compiler/tests/generated/fixtures/{name}.wir.wado' \
    --default-world test \
    -O2
"""

[tasks.update-golden-format-fixtures]
description = "Regenerate format fixture golden files (clean, NIR, lower, optimize, WIR, WAT)"
depends = ["build-golden-tools"]
file = "scripts/update-golden-format-fixtures.sh"

[tasks.doc-stdlib]
description = "Generate stdlib reference docs (one file per core module, combined wasi)"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo build --bin wado --quiet

CORE_MODULES="core:prelude core:cli core:collections core:base64 core:zlib \
  core:serde core:json core:json_nsd core:args core:value core:cbor core:simd core:url core:kiln \
  core:benchmark core:router core:digest core:random core:uuid core:temporal core:log core:jwt"
WASI_MODULES="wasi:cli wasi:filesystem wasi:http wasi:clocks wasi:random wasi:sockets wasi:tls"

cargo run --bin wado --quiet -- doc --format markdown -o 'docs/stdlib-{module}.md' \
  $CORE_MODULES
cargo run --bin wado --quiet -- doc --format markdown --title "WASI Standard Library" \
  -o docs/stdlib-wasi.md $WASI_MODULES
"""

[tasks.clean]
description = "Clean all build artifacts"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo clean
rm -f example/*.wat example/*.wasm
mise run -C benchmark clean
mise run -C wasm-size clean
"""

[tasks.install-wado-vscode-dev]
description = "Install wado-vscode extension for development"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cd wado-vscode
npm install && npm run compile
if [ -e ~/.vscode/extensions/wado-lang.wado-0.0.1 ]; then
    echo "wado-vscode is already installed"
else
    ln -s "$PWD" ~/.vscode/extensions/wado-lang.wado-0.0.1
fi
"""

[tasks.clean-wado-vscode-dev]
description = "Remove wado-vscode development symlink"
run = "rm -f ~/.vscode/extensions/wado-lang.wado-0.0.1"

[tasks.test-wado-vscode]
description = "Run wado-vscode tests"
run = "cd wado-vscode && npm install && npm run test:unit && npm run test"

[tasks.build-wado-lsp-wasm-rust]
description = "Build the wado-lsp wasm32-wasip1 binary (-Os) into wado-vscode/out/ (Rust only)"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
# @vscode/wasm-wasi-lsp hosts wasm32-wasip1 modules only, not p2 components; see
# docs/wep-2026-04-18-lsp-architecture.md. Size over speed: it ships in the VSIX.
CARGO_PROFILE_RELEASE_OPT_LEVEL=s CARGO_PROFILE_RELEASE_LTO=true \
  cargo build -p wado-lsp --bin wado-lsp --target wasm32-wasip1 --release
mkdir -p wado-vscode/out
cp target/wasm32-wasip1/release/wado-lsp.wasm wado-vscode/out/wado_lsp.wasm
"""

[tasks.build-wado-lsp-wasm]
description = "Build wado-lsp wasm + wado-vscode TS into wado-vscode/out/"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
mise run build-wado-lsp-wasm-rust

# Without this, a Reload Window picks up JS that no longer matches the wasm.
( cd wado-vscode && [ -d node_modules ] || npm install )
( cd wado-vscode && npm run compile )
"""

[tasks.watch-wado-lsp-wasm]
description = "Watch wado-lsp + wado-vscode TS; keep wado-vscode/out/ continuously fresh"
run = """
#!/usr/bin/env bash
set -e -o pipefail

( cd wado-vscode && [ -d node_modules ] || npm install )

# A TS change still needs "Developer: Reload Window"; VS Code does not reload
# extension code on its own.
( cd wado-vscode && exec npm run watch ) &
TSC_PID=$!
trap 'kill -TERM $TSC_PID 2>/dev/null || true; wait $TSC_PID 2>/dev/null || true' EXIT INT TERM

# A Rust change does not: the extension's FileSystemWatcher restarts the server
# on the new wasm. Rust-only build task, since tsc above already covers the TS.
cargo watch \\
    -w wado-lsp \\
    -w wado-compiler \\
    -w wado-manifest \\
    -s 'mise run build-wado-lsp-wasm-rust'
"""

[tasks.update-wado-vscode-grammar]
description = "Regenerate wado-vscode syntax files from syntax.rs"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo run --bin wado -- syntax --format tmLanguage -o wado-vscode/syntaxes/wado.tmLanguage.json
cargo run --bin wado -- syntax --format language-config -o wado-vscode/language-configuration.json
"""

[tasks.update-json-schema-files]
description = "Download TextMate grammar and language-configuration JSON schemas"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
mkdir -p wado-cli/schemas
curl -sL "https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json" \
    | sed 's|"$schema": "http://json-schema.org/schema#"|"$schema": "http://json-schema.org/draft-07/schema#"|g; s|"id":|"$id":|g' \
    > wado-cli/schemas/tmlanguage.schema.json
curl -sL "https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/language-configuration.json" \
    > wado-cli/schemas/language-configuration.schema.json
"""

[tasks.sync-vendor]
description = "Sync vendor submodules (wasmtime pinned to Cargo.lock, others to latest)"
run = "scripts/sync-vendor.sh"

[tasks.update-stdlib-wasi]
description = "Regenerate wasi stdlib from WIT files"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
rm -rf wado-compiler/lib/wasi/
mkdir -p wado-compiler/lib/wasi/
cargo run -p wado-from-idl -- \
    --wit-dir vendor/wasmtime/crates/wasi-http/src/p3/wit \
    --output-dir wado-compiler/lib/wasi
cargo run -p wado-from-idl -- \
    --wit-dir vendor/wasmtime/crates/wasi/src/p3/wit \
    --output-dir wado-compiler/lib/wasi
cargo run -p wado-from-idl -- \
    --wit-dir vendor/wasmtime/crates/wasi-tls/src/p3/wit \
    --output-dir wado-compiler/lib/wasi
find wado-compiler/lib/wasi -type f -name '*.wado' -exec cargo run -p wado-cli -- format -w {} +
"""

[tasks.webidl-deps]
description = "Install @webref/idl for the WebIDL snapshot (scripts/webidl)"
run = "cd scripts/webidl && npm install"

[tasks.update-webidl-snapshot]
description = "Re-snapshot the WebIDL slice from @webref/idl into lib/web/dom.webidl.json"
depends = ["webidl-deps"]
run = "node scripts/webidl/snapshot.mjs wado-compiler/lib/web/dom.webidl.json"

[tasks.update-stdlib-web]
description = "Regenerate the web:dom stdlib from the vendored WebIDL snapshot"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo run -p wado-from-idl -- \
    --webidl wado-compiler/lib/web/dom.webidl.json \
    --output-dir wado-compiler/lib/web
"""

[tasks.update-stdlib-kiln]
description = "Regenerate core:kiln stdlib submodules from WIT file (facade is hand-written)"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
# Submodules only — the facade `lib/core/kiln.wado` is hand-written.
rm -f wado-compiler/lib/core/kiln/*.wado
cargo run -p wado-from-idl -- \
    --wit-dir wado-compiler/lib/core/kiln \
    --output-dir wado-compiler/lib/core \
    --skip-flat-reexport
"""

[tasks.update-bundled]
description = "Rebuild bundled libm Wasm module"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
# STRIP=none keeps the name section, which the `wado.dataref` map is keyed by.
cd wado-bundled-libm && CARGO_PROFILE_RELEASE_OPT_LEVEL=s CARGO_PROFILE_RELEASE_LTO=true CARGO_PROFILE_RELEASE_STRIP=none cargo build --release && cd ..
WAT_FILE="wado-compiler/lib/core/libm.wat"
WAT_TMP="${WAT_FILE}.tmp"
cargo run --bin wado-dev-tools -- bundled-asset target/wasm32-unknown-unknown/release/wado_bundled_libm.wasm > "$WAT_TMP"
if cmp -s "$WAT_TMP" "$WAT_FILE"; then
  rm "$WAT_TMP"
  echo "  bundled libm WAT unchanged, skipping update"
else
  mv "$WAT_TMP" "$WAT_FILE"
  echo "  bundled libm WAT updated"
fi
"""

[tasks.list-todo]
description = "List E2E test fixtures whose module or tests are marked #![TODO] / #[TODO]"
run = """
grep -lE '^#!?\\[TODO\\]' wado-compiler/tests/fixtures/*.wado 2>/dev/null | sort
"""

[tasks.benchmark-all]
description = "Run all benchmarks"
run = "mise run -C benchmark all"

# The arm an A/B compares against: `origin/main`'s compiler, kept as the one
# binary, since the worktree and target dir it was built from are gigabytes and
# nothing reads them afterwards. Cached under the commit, so a moved main
# rebuilds rather than quietly comparing against a stale compiler. Prints the
# binary's path, which is what `WADO_BIN` takes.
[tasks.benchmark-baseline]
description = "Build (once) the origin/main compiler that `benchmark/ab.ts` compares against"
run = """
#!/usr/bin/env bash
set -euo pipefail

git fetch -q origin main
want="$(git rev-parse origin/main)"
cache="${WADO_BASELINE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/wado/baseline}"
bin="$cache/$want/wado"

if [ ! -x "$bin" ]; then
    echo "building the ${want:0:12} baseline (once, ~5 min)" >&2
    tmp="$(mktemp -d)"
    # The worktree and the target dir under it are gigabytes, and a build that
    # fails must not leave them behind either.
    trap 'git worktree remove --force "$tmp/tree" 2>/dev/null || true; rm -rf "$tmp" "$bin.$$"' EXIT
    git worktree prune  # a wiped temp dir leaves the registration behind
    git worktree add -q --detach "$tmp/tree" "$want"
    (cd "$tmp/tree" && cargo build --release -q -p wado-cli)
    mkdir -p "$(dirname "$bin")"
    # Published by rename from a path this invocation alone writes, so no
    # interrupted or racing copy leaves a truncated compiler for the `-x` above.
    # The temp is in the cache dir: a rename is atomic within one filesystem.
    cp "$tmp/tree/target/release/wado" "$bin.$$"
    mv "$bin.$$" "$bin"
    # One baseline is enough; the rest are compilers no A/B asks for again.
    find "$cache" -mindepth 1 -maxdepth 1 -not -name "$want" -exec rm -rf {} +
fi
echo "$bin"
"""

[tasks.benchmark-count-prime]
description = "Run count_prime benchmark"
run = "mise run -C benchmark count-prime"

[tasks.benchmark-mandelbrot]
description = "Run mandelbrot benchmark"
run = "mise run -C benchmark mandelbrot"

[tasks.benchmark-sieve]
description = "Run sieve benchmark"
run = "mise run -C benchmark sieve"

[tasks.benchmark-zlib]
description = "Run zlib benchmark"
run = "mise run -C benchmark zlib"

[tasks.benchmark-fts]
description = "Run fts benchmark"
run = "mise run -C benchmark fts"

[tasks.benchmark-json-twitter]
description = "Run json-twitter benchmark"
run = "mise run -C benchmark json-twitter"

[tasks.benchmark-cbor]
description = "Run cbor ser/de benchmark (serde_cbor vs Wado core:cbor) over twitter/canada/catalog"
run = "mise run -C benchmark cbor"

[tasks.benchmark-json-canada]
description = "Run json-canada benchmark"
run = "mise run -C benchmark json-canada"

[tasks.benchmark-json-catalog]
description = "Run json-catalog benchmark"
run = "mise run -C benchmark json-catalog"

[tasks.benchmark-sqlite-parse]
description = "Run sqlite-parse benchmark"
run = "mise run -C benchmark sqlite-parse"

[tasks.benchmark-syntax-highlight]
description = "Run syntax-highlight benchmark"
run = "mise run -C benchmark syntax-highlight"

[tasks.benchmark-gale-gen]
description = "Run gale-gen benchmark (Gale generator throughput over the Rust grammar)"
run = "mise run -C benchmark gale-gen"

[tasks.benchmark-http-routing]
description = "Run http-routing benchmark (wado serve vs Hono on Node.js and Bun vs Axum)"
run = "mise run -C benchmark http-routing"

[tasks.report-wasm-size]
description = "Build all languages and report Wasm sizes"
run = "mise run -C wasm-size report-wasm-size"

[tasks.report-const-regions]
description = "Count the compile-time regions that survive optimization, by cause"
run = """
#!/usr/bin/env bash
set -xe -o pipefail
cargo build --bin wado
node scripts/const-region-census.mjs
"""

[tasks.jco-deps]
description = "Install the released jco for the vendor-free pipeline (scripts/jco)"
run = "cd scripts/jco && npm install"

[tasks.jco-transpile-released]
description = "Transpile a Wado .wasm component to JS via the released jco"
depends = ["jco-deps"]
run = """
#!/usr/bin/env bash
set -e -o pipefail
WASM_FILE="${1:?Usage: mise run jco-transpile-released <wasm-file> [output-dir]}"
node scripts/jco/transpile-released.mjs "$WASM_FILE" ${2:+"$2"}
"""

[tasks.jco-hello-released]
description = "Compile, transpile (released jco), and run example/hello.wado on Node"
depends = ["jco-deps"]
run = """
#!/usr/bin/env bash
set -e -o pipefail
WASM="$(mktemp -d)/hello.wasm"
OUT="$(mktemp -d)/hello-released"
cargo run -q -p wado-cli -- compile -O2 -o "$WASM" example/hello.wado
node scripts/jco/transpile-released.mjs "$WASM" "$OUT"
# Node 26 ships stable JSPI (WebAssembly.Suspending), so no flag is needed.
# The shim flushes stdout after run() resolves, so the loop drains rather than
# exiting on it; the timeout is what bounds a run that never settles.
timeout 120 node -e "
  process.on('unhandledRejection', e => { console.error(e); process.exit(1); });
  import('$OUT/hello.js').then(m => m.run.run())
    .catch(e => { console.error(e); process.exit(1); });
"
"""


[tasks.cloudflare-build]
description = "Compile a Wado service and transpile it for the Cloudflare Worker"
depends = ["jco-deps"]
run = "cloudflare-worker/build.sh"

[tasks.cloudflare-dev]
description = "Serve the Cloudflare Worker locally (run cloudflare-build first)"
run = """
#!/usr/bin/env bash
set -e -o pipefail
cd cloudflare-worker
[ -d node_modules ] || npm install
npx wrangler dev "$@"
"""

[tasks.jco-bench]
description = "Benchmark a Wado program on Node via jco (compile -f no-wide-arithmetic, transpile, self-time 3x)"
depends = ["jco-deps"]
run = """
#!/usr/bin/env bash
set -e -o pipefail
WADO="${1:?Usage: mise run jco-bench <program.wado> [runs]}"
RUNS="${2:-3}"
NAME=$(basename "$WADO" .wado)
WORK=$(mktemp -d)
# V8 has no wide-arithmetic; -f no-wide-arithmetic keeps float formatting (and
# any i128 math) off the native ops so the component runs under Node.
cargo run -q -p wado-cli -- compile -O2 -f no-wide-arithmetic -o "$WORK/$NAME.wasm" "$WADO"
node scripts/jco/transpile-released.mjs "$WORK/$NAME.wasm" "$WORK/jco" >/dev/null
echo "# $NAME on Node (jco, self-timed, best of $RUNS):"
for i in $(seq 1 "$RUNS"); do
  # `timeout` guards against the known jco read-stream deadlock: filesystem-backed
  # benchmarks (Preopens) hang forever, so cap each run instead of wedging.
  if ! timeout 120 node -e "
    process.on('unhandledRejection', e => { console.error(e); process.exit(1); });
    import('$WORK/jco/$NAME.js').then(m => m.run.run())
      .catch(e => { console.error(e.message || e); process.exit(1); });
  "; then
    echo "error: '$NAME' did not finish on Node (timed out or errored). Filesystem-backed benchmarks are not yet supported via jco." >&2
    exit 1
  fi
done
"""

[tasks.playground-web-build]
description = "Build the client-side browser playground assets into wado-playground/web/"
depends = ["jco-deps"]
run = "wado-playground/web/build.sh"

[tasks.playground-web-package]
description = "Package the built playground runtime into wado-playground/web/wado-playground-web.tar.gz (the site consumes this release asset)"
depends = ["playground-web-build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
WEB="wado-playground/web"
OUT="${OUT:-$WEB/wado-playground-web.tar.gz}"
VERSION="${WADO_PLAYGROUND_VERSION:-$(git rev-parse --short HEAD)}"
STAGE="$(mktemp -d)"
trap 'rm -rf "$STAGE"' EXIT
# Keep this file set in sync with the site's `playground-runtime` mise task.
# wado-playground.wasm bundles the LSP engine, so there is no separate LSP wasm.
cp "$WEB"/playground.js "$WEB"/runner-worker.js "$WEB"/lsp-worker.js "$WEB"/lsp-client.js \\
   "$WEB"/wado-playground.wasm "$WEB"/examples.json "$STAGE/"
cp -r "$WEB"/vendor "$WEB"/shims "$STAGE/"
printf '{ "version": "%s" }\\n' "$VERSION" > "$STAGE/manifest.json"
tar czf "$OUT" -C "$STAGE" .
echo "packaged $OUT (version $VERSION)"
tar tzf "$OUT"
"""

[tasks.playground-web-serve]
description = "Serve the browser playground on http://127.0.0.1:8088 (run playground-web-build first)"
run = "cd wado-playground/web && python3 -m http.server 8088"

[tasks.playground-web-test]
description = "Browser smoke test for the playground (installs playwright-core; needs Chromium 137+)"
run = """
#!/usr/bin/env bash
set -e -o pipefail
(cd scripts/jco && node -e "require.resolve('playwright-core')" 2>/dev/null || npm install playwright-core)
node wado-playground/web/test-browser.mjs
node wado-playground/web/test-lsp-browser.mjs
"""
