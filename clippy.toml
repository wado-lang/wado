# `absolute_paths` (warn, see Cargo.toml) fires on any path not brought into
# scope by a `use`. Only local paths are the target, so every crate we depend on
# is allowed and `max-segments = 0` catches even a two-segment `crate::item`.
# A new dependency reached by an absolute path belongs on this list.
absolute-paths-max-segments = 0
absolute-paths-allowed-crates = [
    "alloc",
    "anyhow",
    "assert_cmd",
    "bytes",
    "core",
    "dprint_plugin_markdown",
    "fluent_uri",
    "futures",
    "glob",
    "http",
    "http_body",
    "http_body_util",
    "hyper",
    "hyper_util",
    "iana_time_zone",
    "indexmap",
    "lexopt",
    "libc",
    "libm",
    "rustc_hash",
    "rustls",
    "rustls_pemfile",
    "semver",
    "serde",
    "serde_json",
    "sha2",
    "spdx",
    "std",
    "tempfile",
    "tokio",
    "tokio_rustls",
    "toml",
    "wado_cli",
    "wado_compiler",
    "wado_from_idl",
    "wado_lsp",
    "wado_manifest",
    "wado_wasm_embed",
    "wasm_encoder",
    "wasmparser",
    "wasmprinter",
    "wasmtime",
    "wasmtime_wasi",
    "wasmtime_wasi_http",
    "wasmtime_wasi_tls",
    "wat",
    "webpki_roots",
    "wit_component",
    "wit_encoder",
    "wit_parser",
    "zlib_rs",
]

disallowed-types = [
    { path = "std::collections::HashMap", reason = "Use crate::hashmap::IndexMap for deterministic iteration order with FxHash" },
    { path = "std::collections::HashSet", reason = "Use crate::hashmap::IndexSet for deterministic iteration order with FxHash" },
]
