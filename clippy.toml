    { path = "wado_compiler::elaborator::Elaborator::impl_target_decl_key", reason = "read the declaration off the block or the type" },
    { path = "wado_compiler::symbol::SymbolTable::imported", reason = "resolve the reference site instead of a spelling" },
    { path = "wado_compiler::symbol::SymbolTable::lookup_in_module", reason = "resolve the reference site instead of a spelling" },
