# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# A review reads sources. What `.gitattributes` marks `linguist-generated` or
# `linguist-vendored` is regenerated or fetched, so it is excluded here too.
# `scripts/check-review-filters.sh` holds the two lists to each other.
language: en-US
reviews:
  high_level_summary: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  # `commit_status` reports through a legacy commit status only while
  # `review_progress` is off.
  review_progress: false
  commit_status: true
  auto_review:
    ignore_usernames:
      - "wado-bot[bot]"
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_filters:
    - "!wado-compiler/tests/generated/**"
    - "!wado-compiler/lib/core/*.wat"
    - "!wado-compiler/lib/wasi/**"
    - "!wado-compiler/lib/core/kiln/*.wado"
    - "!wado-compiler/lib/core/kiln/deps/*.wit"
    - "!wado-compiler/lib/core/eval/*.wado"
    - "!wado-compiler/lib/core/coverage/*.wado"
    - "!wado-compiler/lib/core/fuel/*.wado"
    - "!wado-compiler/lib/core/process/*.wado"
    - "!wado-compiler/lib/core/process/deps/*.wit"
    - "!wado-compiler/lib/core/icu/properties.wado"
    - "!wado-bundled-icu/wit-properties/properties.wit"
    - "!wado-bundled-icu/src/properties/values.rs"
    - "!package-gale/tests/generated/**"
    - "!**/*.kiln.json"
    - "!docs/stdlib-*.md"
    - "!scripts/rust-inline-paths.json"
    - "!scripts/stdlib-coverage.json"
    - "!**/pgo/*.pgo"
    - "!package-wadopoet/src/vocabulary.wado"
    - "!package-loam/tests/models/tiny-gpt2/generate.json"
    - "!package-loam/tests/models/tiny-gpt2/model.onnxtext"
    - "!package-loam/tests/models/tiny-gpt2/model.safetensors"
    - "!package-loam/tests/models/tiny-gpt2/sharded/*.safetensors"
    - "!package-loam/tests/models/tiny-gpt2/external/*"
    - "!package-loam/tests/**/*.onnx"
    - "!package-loam/conformance/semantics/*.onnx"
    - "!package-loam/conformance/operators/*.onnx"
    - "!package-loam/conformance/semantics/*.txt"
    - "!package-loam/conformance/operators/*.txt"
    - "!package-eddy/eval/*.json"
    - "!package-loam/tests/**/*.pb"
    - "!package-loam/tests/models/tiny-gpt2/tokenizer.json"
    - "!package-loam/example/gpt2-124m/tokenizer.json"
    - "!package-grog/tests/proto/**/*.proto"
    - "!package-loam/src/onnx.proto"
    - "!package-web/src/dom.wado"
    - "!package-web/glue/dom.js"
    - "!package-web/idl/*.webidl.json"
