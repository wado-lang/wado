# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# A review reads sources. What `.gitattributes` marks `linguist-generated` or
# `linguist-vendored` is regenerated or fetched, so it is excluded here too.
# `scripts/check-review-filters.sh` holds the two lists to each other.
language: en-US
reviews:
  path_filters:
    - "!wado-compiler/tests/generated/**"
    - "!wado-compiler/lib/core/*.wat"
    - "!wado-compiler/lib/wasi/**"
    - "!package-gale/tests/generated/**"
    - "!**/*.kiln.json"
    - "!docs/stdlib-*.md"
    - "!scripts/rust-inline-paths.json"
    - "!package-wadopoet/src/vocabulary.wado"
    - "!package-loam/tests/models/tiny-gpt2/generate.json"
    - "!package-loam/tests/models/tiny-gpt2/model.onnxtext"
    - "!package-loam/tests/models/tiny-gpt2/model.safetensors"
    - "!package-loam/tests/**/*.onnx"
    - "!package-loam/tests/**/*.pb"
    - "!package-loam/tests/models/tiny-gpt2/vocab.json"
    - "!package-loam/tests/models/tiny-gpt2/merges.txt"
    - "!package-grog/tests/proto/**/*.proto"
    - "!package-web/src/dom.wado"
    - "!package-web/glue/dom.js"
    - "!package-web/idl/*.webidl.json"
