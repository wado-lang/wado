[package]
name = "pjrt"
description = "A device behind a PJRT plugin, served by `wado run-pjrt`"
repository-directory = "wado-run-pjrt"
lib = "src/pjrt.wado"
# version / repository / namespace / license / authors inherited from [workspace.package]

