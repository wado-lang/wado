[package]
name = "wado-lsp"
version = "0.1.0"
edition = "2024"
description = "Language service engine for the Wado programming language"
license = { workspace = true }

[[bin]]
name = "wado-lsp"
path = "src/bin/wado-lsp.rs"

[dependencies]
wado-compiler = { path = "../wado-compiler" }
indexmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `futures::executor::block_on` drives the async server loop without pulling
# in a full multi-threaded runtime. wado-cli keeps tokio for HTTP serving;
# wado-lsp stays minimal so the `wasm32-wasip2` artifact doesn't bundle a
# scheduler it can't use anyway.
futures = { workspace = true }

# Dev-only: `#[tokio::test]` drives the async unit tests. Not built for
# `wasm32-wasip2` because tests don't run there.
[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[lints]
workspace = true
